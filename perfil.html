    <style>
        body {
            background-color: #f7f5f2;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .brand-logo-rings {
            width: 48px;
            height: 48px;
            margin: 0 auto 6px;
            display: block;
        }

        .brand-title {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #382a23;
            margin: 0;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 6px;
        }

        .perfil-card-wrapper {
            width: 100%;
            max-width: 440px;
            background: #3b2a24;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding: 28px;
            color: #ffffff;
            box-sizing: border-box;
        }

        .perfil-header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            font-family: Georgia, serif;
        }

        .perfil-header-nav span {
            font-size: 18px;
            font-weight: bold;
            color: #f7f5f2;
        }

        .perfil-header-nav a {
            background: none;
            border: none;
            color: #eadecc;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }

        .perfil-avatar-container {
            width: 80px;
            height: 80px;
            background-color: #f7ecd7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            color: #b08d4b;
            font-size: 32px;
            font-weight: bold;
            border: 3px solid #eadecc;
            font-family: Georgia, serif;
        }

        .cargo-fixo {
            text-align: center;
            font-size: 13px;
            color: #eadecc;
            text-transform: uppercase;
            letter-spacing: 1.5px;

            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #c5a059;
        }

        .btn-salvar-perfil {
            background: #25d366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .btn-salvar-perfil:hover {
            background: #20ba5a;
        }

        .feedback-msg {
            text-align: center;
            font-size: 12px;
            margin-top: 12px;
            color: #25d366;
            display: none;
        }

        .error-msg {
            text-align: center;
            font-size: 12px;
            margin-top: 12px;
            color: #ff5c5c;
            display: none;
        }
    </style>
</head>
<body>

    <header class="brand-header">
        <svg class="brand-logo-rings" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M35 50C46.0457 50 55 41.0457 55 30C55 18.9543 46.0457 10 35 10C23.9543 10 15 18.9543 15 30C15 41.0457 23.9543 50 35 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M65 50C76.0457 50 85 41.0457 85 30C85 18.9543 76.0457 10 65 10C53.9543 10 45 18.9543 45 30C45 41.0457 53.9543 50 65 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="3" fill="#c5a059"/>
        </svg>
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">CRONOGRAMA DE CASAMENTO</p>
    </header>

    <div class="perfil-card-wrapper">
        <div class="perfil-header-nav">
            <span>Meu Perfil</span>
            <a href="proxima_pagina.html">← Voltar ao Painel</a>
        </div>

        <div class="perfil-avatar-container" id="avatarInicial">A</div>
        <div class="cargo-fixo" id="textoCargoFixo">Administrador(a)</div>

        <div class="form-group">
            <label for="inputNome">Seu Nome</label>
            <input type="text" id="inputNome" placeholder="Digite seu nome...">
        </div>

        <div class="form-group">
            <label for="inputSenhaAtual">Senha Atual</label>
            <input type="password" id="inputSenhaAtual" placeholder="Digite a senha atual...">
        </div>

        <div class="form-group">
            <label for="inputNovaSenha">Nova Senha (opcional)</label>
            <input type="password" id="inputNovaSenha" placeholder="Digite a nova senha...">
        </div>

        <div class="form-group">
            <label for="inputConfirmaSenha">Confirmar Nova Senha</label>
            <input type="password" id="inputConfirmaSenha" placeholder="Confirme a nova senha...">
        </div>

        <button class="btn-salvar-perfil" onclick="salvarPerfil()">Guardar Alterações</button>
        <div class="feedback-msg" id="msgSucesso">Perfil atualizado com sucesso!</div>
        <div class="error-msg" id="msgErro">Erro ao atualizar perfil.</div>
    </div>

    <script>
        let nomeOriginal = "";
        let userRole = "admin";

        window.addEventListener("DOMContentLoaded", function () {
            userRole = localStorage.getItem('user_role') || 'admin';
            const adminNome = localStorage.getItem('admin_nome') || '';
            const assistenteNome = localStorage.getItem('assistente_nome') || '';
            
            nomeOriginal = userRole === 'admin' ? (adminNome || 'Administrador') : (assistenteNome || 'Assistente');

            document.getElementById('inputNome').value = nomeOriginal;
            document.getElementById('avatarInicial').textContent = nomeOriginal.charAt(0).toUpperCase();

            if (userRole === 'admin') {
                document.getElementById('textoCargoFixo').textContent = "Administrador(a)";
            } else {
                document.getElementById('textoCargoFixo').textContent = "Assistente de Campo";
            }
        });

        async function hashPassword(senha) {
            const encoder = new TextEncoder();
            const data = encoder.encode(senha);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function salvarPerfil() {
            const novoNome = document.getElementById('inputNome').value.trim();
            const senhaAtual = document.getElementById('inputSenhaAtual').value;
            const novaSenha = document.getElementById('inputNovaSenha').value;
            const confirmaSenha = document.getElementById('inputConfirmaSenha').value;

            document.getElementById('msgErro').style.display = 'none';
            document.getElementById('msgSucesso').style.display = 'none';

            if (!novoNome) {
                alert("Por favor, preencha o seu nome.");
                return;
            }

            let dadosAtualizacao = { nome: novoNome };

            if (novaSenha || confirmaSenha) {
                if (!senhaAtual) {
                    document.getElementById('msgErro').textContent = "Digite a senha atual para confirmar a alteração.";
                    document.getElementById('msgErro').style.display = 'block';
                    return;
                }

                if (novaSenha !== confirmaSenha) {
                    document.getElementById('msgErro').textContent = "As novas senhas não coincidem.";
                    document.getElementById('msgErro').style.display = 'block';
                    return;
                }

                if (novaSenha.length < 6) {
                    document.getElementById('msgErro').textContent = "A nova senha deve ter pelo menos 6 caracteres.";
                    document.getElementById('msgErro').style.display = 'block';
                    return;
                }

                const { data: colabData, error: errFetch } = await _supabase
                    .from('colaboradores')
                    .select('*')
                    .eq('role', userRole)
                    .maybeSingle();

                if (errFetch || !colabData) {
                    document.getElementById('msgErro').textContent = "Erro ao localizar colaborador no banco.";
                    document.getElementById('msgErro').style.display = 'block';
                    return;
                }

                const senhaAtualHash = await hashPassword(senhaAtual);

                if (colabData.senha_hash && colabData.senha_hash !== senhaAtualHash && colabData.senha_hash !== senhaAtual) {
                    document.getElementById('msgErro').textContent = "A senha atual está incorreta.";
                    document.getElementById('msgErro').style.display = 'block';
                    return;
                }

                dadosAtualizacao.senha_hash = await hashPassword(novaSenha);
            }

            const { error: errColab } = await _supabase
                .from('colaboradores')
                .update(dadosAtualizacao)
                .eq('role', userRole);

            if (errColab) {
                document.getElementById('msgErro').textContent = "Erro ao atualizar no banco: " + errColab.message;
                document.getElementById('msgErro').style.display = 'block';
                return;
            }

            if (userRole === 'admin') {
                localStorage.setItem('admin_nome', novoNome);
            } else {
                localStorage.setItem('assistente_nome', novoNome);
            }
            nomeOriginal = novoNome;

            document.getElementById('avatarInicial').textContent = novoNome.charAt(0).toUpperCase();
            
            const msg = document.getElementById('msgSucesso');
            msg.style.display = 'block';
            
            document.getElementById('inputSenhaAtual').value = '';
            document.getElementById('inputNovaSenha').value = '';
            document.getElementById('inputConfirmaSenha').value = '';

            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
