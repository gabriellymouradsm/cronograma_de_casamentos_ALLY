<body>

    <!-- MODAL DE CONFIRMAÇÃO ELEGANTE -->
    <div class="modal-overlay" id="modalConfirmacao">
        <div class="modal-card">
            <div class="modal-icon-container">?</div>
            <div class="modal-titulo" id="modalTituloText">Confirmação</div>
            <div class="modal-mensagem" id="modalMensagemText">Deseja realmente realizar esta ação?</div>
            <div class="modal-botoes">
                <button class="modal-btn modal-btn-cancelar" onclick="fecharModalConfirmacao()">CANCELAR</button>
                <button class="modal-btn modal-btn-confirmar" id="modalBtnConfirmar" onclick="executarAcaoConfirmada()">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <header class="brand-header">
        <svg class="brand-logo-rings" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M35 50C46.0457 50 55 41.0457 55 30C55 18.9543 46.0457 10 35 10C23.9543 10 15 18.9543 15 30C15 41.0457 23.9543 50 35 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M65 50C76.0457 50 85 41.0457 85 30C85 18.9543 76.0457 10 65 10C53.9543 10 45 18.9543 45 30C45 41.0457 53.9543 50 65 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="3" fill="#c5a059"/>
        </svg>
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">CRONOGRAMA DE CASAMENTO</p>
    </header>

    <div class="schedule-container">
        <h2>Cronograma do Dia</h2>
        
        <!-- Formulário de Cadastro (Admin Apenas) -->
        <div class="form-grid" id="admin-form-section">
            <div class="input-row">
                <input type="time" id="time-input" class="input-field input-time">
                <input type="text" id="activity-input" class="input-field input-activity" placeholder="Atividade (ex: Entrada da Noiva)">
            </div>
            <textarea id="note-input" class="input-field input-note" placeholder="Observações opcionais (ex: portão principal, som...)" rows="2"></textarea>
            <button id="add-btn" onclick="addScheduleItem()">Adicionar ao Cronograma</button>
        </div>
        
        <div id="schedule-list"></div>
        
        <div class="footer-navigation">
            <button class="clear-all-btn" id="btn-clear-all" onclick="confirmarLimparTodos()">Limpar Todos</button>
            <a href="proxima_pagina.html" class="back-link">← Voltar ao Painel</a>
        </div>
    </div>

<script>
    const userRole = localStorage.getItem('user_role');
    const casalAtivo = localStorage.getItem('casal_ativo') || 'Geral';
    let scheduleItems = [];
    let funcaoCallbackPendente = null;

    function abrirModalConfirmacao(titulo, mensagem, callback) {
        document.getElementById('modalTituloText').textContent = titulo;
        document.getElementById('modalMensagemText').textContent = mensagem;
        funcaoCallbackPendente = callback;
        document.getElementById('modalConfirmacao').classList.add('ativo');
    }

    function fecharModalConfirmacao() {
        document.getElementById('modalConfirmacao').classList.remove('ativo');
        funcaoCallbackPendente = null;
    }

    function executarAcaoConfirmada() {
        if (funcaoCallbackPendente) {
            funcaoCallbackPendente();
        }
        fecharModalConfirmacao();
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (userRole === 'assistant') {
            document.getElementById('admin-form-section').style.display = 'none';
            document.getElementById('btn-clear-all').style.display = 'none';
        }
        loadScheduleFromSupabase();
    });

    async function loadScheduleFromSupabase() {
        const { data, error } = await _supabase
            .from('cronograma_dia')
            .select('*')
            .eq('casal_nome', casalAtivo);

        if (error) {
            console.error("Erro ao carregar cronograma:", error);
            return;
        }

        scheduleItems = data || [];
        sortSchedule();
        renderSchedule();
        updatePDFStorage();
    }

    function sortSchedule() {
        scheduleItems.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
    }

    function updatePDFStorage() {
        const pdfData = scheduleItems.map(item => {
            let textoAtividade = item.text;
            if (item.note) {
                const linhas = item.note.split('\n');
                linhas.forEach(l => {
                    if (l.trim()) textoAtividade += ` \nobs: ${l.trim().replace(/^obs:\s*/i, '')}`;
                });
            }
            return {
                horario: item.time || '-',
                atividade: textoAtividade
            };
        });
        localStorage.setItem('cronograma_dados', JSON.stringify(pdfData));
    }

    async function addScheduleItem() {
        if (userRole === 'assistant') return;

        const time = document.getElementById('time-input').value;
        const text = document.getElementById('activity-input').value.trim();
        const note = document.getElementById('note-input').value.trim();

        if (!time || !text) {
            alert("Por favor, preencha o horário e a atividade.");
            return;
        }

        const { error } = await _supabase.from('cronograma_dia').insert([{
            time,
            text,
            note,
            completed: false,
            casal_nome: casalAtivo
        }]);

        if (error) {
            console.error("Erro ao adicionar atividade:", error);
            return;
        }

        document.getElementById('time-input').value = "";
        document.getElementById('activity-input').value = "";
        document.getElementById('note-input').value = "";

        loadScheduleFromSupabase();
    }

    function renderSchedule() {
        const listContainer = document.getElementById('schedule-list');
        listContainer.innerHTML = '';

        if (scheduleItems.length === 0) {
            listContainer.innerHTML = `<p style="text-align: center; color: #b5ada5; font-size: 13px; padding: 20px;">Nenhuma atividade cadastrada.</p>`;
            return;
        }

        scheduleItems.forEach((item) => {
            const itemDiv = document.createElement('div');
            itemDiv.classList.add('schedule-item');
            if (item.completed) itemDiv.classList.add('completed');

            const headerDiv = document.createElement('div');
            headerDiv.classList.add('schedule-header');

            const timeSpan = document.createElement('span');
            timeSpan.classList.add('schedule-time');
            timeSpan.textContent = item.time || '--:--';

            const actionRow = document.createElement('div');
            actionRow.classList.add('action-row');

            const statusSpan = document.createElement('span');
            statusSpan.classList.add('status-badge');
            statusSpan.textContent = item.completed ? 'Concluído' : 'Pendente';
            statusSpan.className = `status-badge ${item.completed ? 'status-concluido' : 'status-pendente'}`;

            statusSpan.addEventListener('click', async () => {
                await _supabase
                    .from('cronograma_dia')
                    .update({ completed: !item.completed })
                    .eq('id', item.id);
                loadScheduleFromSupabase();
            });

            actionRow.appendChild(statusSpan);

            if (userRole !== 'assistant') {
                const deleteBtn = document.createElement('button');
                deleteBtn.classList.add('delete-btn');
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.title = 'Remover Atividade';
                deleteBtn.addEventListener('click', () => {
                    deletarAtividade(item.id, item.text);
                });
                actionRow.appendChild(deleteBtn);
            }

            headerDiv.appendChild(timeSpan);
            headerDiv.appendChild(actionRow);

            const textSpan = document.createElement('span');
            textSpan.classList.add('schedule-text');
            textSpan.textContent = item.text;

            itemDiv.appendChild(headerDiv);
            itemDiv.appendChild(textSpan);

            if (item.note) {
                const linhasNotas = item.note.split('\n');
                linhasNotas.forEach(linha => {
                    if (linha.trim() !== '') {
                        const noteSpan = document.createElement('span');
                        noteSpan.classList.add('schedule-note');
                        const textoLimpo = linha.replace(/^obs:\s*/i, '').trim();
                        noteSpan.textContent = `obs: ${textoLimpo}`;
                        itemDiv.appendChild(noteSpan);
                    }
                });
            }

            const occurrenceBox = document.createElement('div');
            occurrenceBox.classList.add('card-occurrence-box');

            const occurrenceInput = document.createElement('textarea');
            occurrenceInput.classList.add('card-occurrence-input');
            occurrenceInput.placeholder = 'Ocorrência fora do comum...';

            const saveOccurrenceBtn = document.createElement('button');
            saveOccurrenceBtn.classList.add('save-occurrence-btn');
            saveOccurrenceBtn.textContent = 'Registrar';

            saveOccurrenceBtn.addEventListener('click', async () => {
                const novoTexto = occurrenceInput.value.trim();
                if (!novoTexto) return;

                const novaNotaAtualizada = item.note ? `${item.note}\n${novoTexto}` : novoTexto;

                const { error } = await _supabase
                    .from('cronograma_dia')
                    .update({ note: novaNotaAtualizada })
                    .eq('id', item.id);

                if (error) {
                    alert("Erro ao registrar ocorrência.");
                    return;
                }
                loadScheduleFromSupabase();
            });

            occurrenceBox.appendChild(occurrenceInput);
            occurrenceBox.appendChild(saveOccurrenceBtn);
            itemDiv.appendChild(occurrenceBox);

            listContainer.appendChild(itemDiv);
        });
    }

    function deletarAtividade(id, nomeAtividade) {
        abrirModalConfirmacao("Remover Atividade", `Deseja remover a atividade "${nomeAtividade}"?`, async () => {
            await _supabase.from('cronograma_dia').delete().eq('id', id);
            loadScheduleFromSupabase();
        });
    }

    function confirmarLimparTodos() {
        abrirModalConfirmacao("Limpar Cronograma", "Deseja apagar todo o cronograma deste casal?", async () => {
            await _supabase.from('cronograma_dia').delete().eq('casal_nome', casalAtivo);
            loadScheduleFromSupabase();
        });
    }
</script>

                .catch(err => console.log('Falha ao registar o Service Worker:', err));

</script>
