<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Casamento</title>

    <link rel="apple-touch-icon" sizes="180x180" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/Logotipo Monograma Elegante Preto.png">

    <!-- BIBLIOTECA PDFMAKE PARA GERAÇÃO DO PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

    <style>
        body {
            background-color: #f7f5f2;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .brand-logo-img {
            width: 50px;
            height: auto;
            display: block;
            margin: 0 auto 8px;
        }

        .brand-title {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #382a23;
            margin: 0;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 6px;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card-resultado {
            background-color: #3b2a22;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            color: #ffffff;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-resultado h1 {
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitulo {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dados-container {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .dado-bloco { margin-bottom: 18px; }
        .dado-bloco:last-child { margin-bottom: 0; }

        .rotulo {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .valor {
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
            word-break: break-word;
        }

        .regressiva-container {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .regressiva-titulo {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .cronometro {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .tempo-unidade {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tempo-numero {
            font-size: 28px;
            font-weight: bold;
            color: #eadecc;
        }

        .tempo-rotulo {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-compartilhar {
            width: 100%;
            padding: 15px;
            background-color: #25D366;
            border: none;
            border-radius: 30px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .btn-compartilhar:hover { transform: translateY(-2px); }

        .btn-pdf {
            width: 100%;
            padding: 15px;
            background-color: #eadecc;
            border: none;
            border-radius: 30px;
            color: #3b2a22;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .btn-pdf:hover {
            background-color: #d8c7b3;
            transform: translateY(-2px);
        }

        .btn-voltar {
            width: 100%;
            padding: 13px;
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-voltar:hover { background-color: rgba(255, 255, 255, 0.08); }

        .coluna-modulos {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-bloco {
            background-color: #3b2a22;
            border-radius: 24px;
            color: #ffffff;
            text-decoration: none;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
            flex: 1;
        }

        .menu-bloco:hover {
            transform: translateY(-3px);
            background-color: #4a352b;
        }

        .menu-bloco h2 {
            font-family: Georgia, serif;
            font-size: 24px;
            margin: 0 0 20px 0;
            font-weight: normal;
        }

        .icon {
            width: 55px;
            height: 55px;
            fill: none;
            stroke: #eadecc;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 900px) {
            .dashboard-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <header class="brand-header">
        <img src="imagens/Logotipo Monograma Elegante Preto.png" class="brand-logo-img" alt="Logo Ally">
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">CRONOGRAMA DE CASAMENTO</p>
    </header>

    <div class="dashboard-container">
        <div class="card-resultado">
            <div>
                <h1>Novo Casal Criado!</h1>
                <div class="subtitulo">Informações Registradas</div>

                <div class="dados-container">
                    <div class="dado-bloco">
                        <span class="rotulo">Casal</span>
                        <span class="valor" id="exibirNome">...</span>
                    </div>

                    <div class="dado-bloco">
                        <span class="rotulo">Data do Casamento</span>
                        <span class="valor" id="exibirData">...</span>
                    </div>

                    <div class="dado-bloco">
                        <span class="rotulo">Horário</span>
                        <span class="valor" id="exibirHorario">...</span>
                    </div>
                </div>

                <div class="regressiva-container">
                    <div class="regressiva-titulo">Contagem Regressiva</div>
                    <div class="cronometro" id="cronometroLayout">
                        <div class="tempo-unidade">
                            <span class="tempo-numero" id="contadorDias">00</span>
                            <span class="tempo-rotulo">Dias</span>
                        </div>
                        <div class="tempo-unidade">
                            <span class="tempo-numero" id="contadorHoras">00</span>
                            <span class="tempo-rotulo">Horas</span>
                        </div>
                        <div class="tempo-unidade">
                            <span class="tempo-numero" id="contadorMinutos">00</span>
                            <span class="tempo-rotulo">Minutos</span>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <button class="btn-compartilhar" onclick="compartilharWhatsApp()">
                    💬 Compartilhar no WhatsApp
                </button>

                <button class="btn-pdf" onclick="gerarPDF()">
                    📄 Criar PDF do Cronograma
                </button>

                <button class="btn-voltar" onclick="editarInformacoes()">
                    Editar Informações
                </button>
            </div>
        </div>

        <div class="coluna-modulos">
            <a href="checkbox.html" class="menu-bloco">
                <h2>Check List</h2>
                <svg class="icon" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="4" height="4" rx="1"/>
                    <rect x="3" y="14" width="4" height="4" rx="1"/>
                    <line x1="10" y1="6" x2="21" y2="6"/>
                    <line x1="10" y1="16" x2="21" y2="16"/>
                </svg>
            </a>

            <a href="lista_de_convidados.html" class="menu-bloco">
                <h2>Lista de Convidados</h2>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                    <circle cx="12" cy="11" r="2"/>
                    <path d="M8 17c0-2 2-3 4-3s4 1 4 3"/>
                </svg>
            </a>
        </div>

        <div class="coluna-modulos">
            <a href="cronograma_do_dia.html" class="menu-bloco">
                <h2>Cronograma do Dia</h2>
                <svg class="icon" viewBox="0 0 24 24">
                    <line x1="4" y1="12" x2="20" y2="12" stroke-width="2"/>
                    <circle cx="7" cy="12" r="3" fill="#3b2a22"/>
                    <circle cx="17" cy="12" r="3" fill="#3b2a22"/>
                </svg>
            </a>

            <a href="fornecedores.html" class="menu-bloco">
                <h2>Fornecedores</h2>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                </svg>
            </a>

            <a href="chat.html" class="menu-bloco">
                <h2>Chat On</h2>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
            </a>
        </div>
    </div>

    <script>
        let nomeSalvo = "";
        let dataSalva = "";
        let horarioSalvo = "";
        let diasFaltandoGlobal = 0;

        window.addEventListener("DOMContentLoaded", function () {
            nomeSalvo = localStorage.getItem("casal_nome");
            dataSalva = localStorage.getItem("casal_data");
            horarioSalvo = localStorage.getItem("casal_horario");

            if (nomeSalvo && dataSalva && horarioSalvo) {
                document.getElementById("exibirNome").textContent = nomeSalvo;
                document.getElementById("exibirData").textContent = dataSalva;
                document.getElementById("exibirHorario").textContent = horarioSalvo;

                atualizarCronometro();
                setInterval(atualizarCronometro, 60000);
            } else {
                alert("Nenhum dado encontrado. Voltando para o formulário.");
                window.location.href = "index.html";
            }
        });

        function atualizarCronometro() {
            if (!dataSalva || !horarioSalvo) return;

            const partesData = dataSalva.split("/");
            const partesHorario = horarioSalvo.split(":");

            if (partesData.length !== 3 || partesHorario.length !== 2) return;

            const dia = parseInt(partesData[0], 10);
            const mes = parseInt(partesData[1], 10) - 1;
            const ano = parseInt(partesData[2], 10);
            const hora = parseInt(partesHorario[0], 10);
            const minuto = parseInt(partesHorario[1], 10);

            const dataEvento = new Date(ano, mes, dia, hora, minuto, 0);
            const agora = new Date();
            const diferencaTempo = dataEvento - agora;

            if (diferencaTempo <= 0) {
                document.getElementById("cronometroLayout").innerHTML =
                    `<div style="width:100%;text-align:center;font-size:18px;">O grande dia chegou! 🎉</div>`;
                diasFaltandoGlobal = 0;
                return;
            }

            const dias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencaTempo % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencaTempo % (1000 * 60 * 60)) / (1000 * 60));

            diasFaltandoGlobal = dias;

            document.getElementById("contadorDias").textContent = String(dias).padStart(2, "0");
            document.getElementById("contadorHoras").textContent = String(horas).padStart(2, "0");
            document.getElementById("contadorMinutos").textContent = String(minutos).padStart(2, "0");
        }

        function compartilharWhatsApp() {
            let mensagem = "*Grande Notícia!* 🔔\n\n";
            mensagem += "Os dados do casal *" + nomeSalvo + "* foram gerados com sucesso!\n";
            mensagem += "🗓️ *Data:* " + dataSalva + "\n";
            mensagem += "⏰ *Horário:* " + horarioSalvo + "\n\n";

            if (diasFaltandoGlobal > 0) {
                mensagem += "Faltam apenas *" + diasFaltandoGlobal + " dias* para essa celebração especial! ✨";
            } else {
                mensagem += "Chegou o momento de comemorar! 🎉";
            }

            const urlWhatsApp = "https://wa.me/?text=" + encodeURIComponent(mensagem);
            window.open(urlWhatsApp, "_blank");
        }

        function editarInformacoes() {
            window.location.href = "index.html";
        }

        function gerarPDF() {
            const cronograma = JSON.parse(localStorage.getItem("cronograma_dados") || "[]");
            const checklist = JSON.parse(localStorage.getItem("checklist_dados") || "[]");
            const convidados = JSON.parse(localStorage.getItem("convidados_dados") || "[]");
            const fornecedores = JSON.parse(localStorage.getItem("fornecedores_dados") || "[]");

            const tabelaCronograma = criarTabelaPDF(
                cronograma, 
                ['Horário', 'Atividade / Evento'], 
                item => [item.horario || '-', item.atividade || '-']
            );

            const tabelaChecklist = criarTabelaPDF(
                checklist, 
                ['Tarefa', 'Status'], 
                item => [item.tarefa || '-', item.status || 'Pendente']
            );

            const tabelaConvidados = criarTabelaPDF(
                convidados, 
                ['Nome do Convidado', 'Categoria', 'Confirmado'], 
                item => [item.nome || '-', item.categoria || '-', item.confirmado || 'Não']
            );

            const tabelaFornecedores = criarTabelaPDF(
                fornecedores, 
                ['Serviço / Categoria', 'Nome do Fornecedor', 'Contato'], 
                item => [item.categoria || '-', item.nome || '-', item.contato || '-']
            );

            const docDefinition = {
                pageSize: 'A4',
                pageMargins: [40, 60, 40, 60],
                content: [
                    { text: 'ALLY', style: 'brandTitle' },
                    { text: 'CRONOGRAMA & PLANEJAMENTO DE CASAMENTO', style: 'brandSubtitle' },
                    { canvas: [{ type: 'line', x1: 0, y1: 10, x2: 515, y2: 10, lineWidth: 1, lineColor: '#3b2a22' }] },
                    { text: '', margin: [0, 10] },

                    { text: 'Informações do Casamento', style: 'sectionTitle' },
                    {
                        table: {
                            widths: ['*', '*'],
                            body: [
                                [{ text: 'Casal: ' + (nomeSalvo || '-'), style: 'tableHeader' }, { text: 'Data: ' + (dataSalva || '-'), style: 'tableHeader' }],
                                [{ text: 'Horário: ' + (horarioSalvo || '-'), style: 'tableHeader' }, { text: 'Dias Restantes: ' + diasFaltandoGlobal, style: 'tableHeader' }]
                            ]
                        },
                        layout: 'noBorders',
                        margin: [0, 0, 0, 20]
                    },

                    { text: '1. Cronograma do Dia', style: 'sectionTitle' },
                    tabelaCronograma,

                    { text: '2. Check List', style: 'sectionTitle' },
                    tabelaChecklist,

                    { text: '3. Lista de Convidados', style: 'sectionTitle' },
                    tabelaConvidados,

                    { text: '4. Fornecedores', style: 'sectionTitle' },
                    tabelaFornecedores
                ],
                styles: {
                    brandTitle: { fontStyle: 'serif', fontSize: 28, bold: true, alignment: 'center', color: '#3b2a22' },
                    brandSubtitle: { fontSize: 10, alignment: 'center', color: '#725a4d', margin: [0, 2, 0, 0] },
                    sectionTitle: { fontSize: 14, bold: true, color: '#3b2a22', margin: [0, 15, 0, 8] },
                    tableHeader: { bold: true, fontSize: 10, color: '#ffffff', fillColor: '#3b2a22' },
                    noData: { italic: true, color: '#888888', margin: [0, 0, 0, 15] }
                },
                defaultStyle: { fontSize: 10, color: '#333333' }
            };

            pdfMake.createPdf(docDefinition).download('Cronograma_Casamento_' + (nomeSalvo || 'Ally') + '.pdf');
        }

        function criarTabelaPDF(dados, cabecalhos, mapearLinha) {
            if (!dados || dados.length === 0) {
                return { text: 'Nenhuma informação registrada nesta seção.', style: 'noData' };
            }

            const bodyTable = [cabecalhos.map(h => ({ text: h, style: 'tableHeader' }))];

            dados.forEach(item => {
                bodyTable.push(mapearLinha(item));
            });

            return {
                table: {
                    headerRows: 1,
                    widths: cabecalhos.map(() => '*'),
                    body: bodyTable
                },
                layout: 'lightHorizontalLines',
                margin: [0, 0, 0, 15]
            };
        }
    </script>
</body>
</html>
