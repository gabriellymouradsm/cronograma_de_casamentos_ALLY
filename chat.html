<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <title>Ally - Notebook / Notas</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #f7f5f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .brand-logo-img {
            width: 45px;
            height: auto;
            display: block;
            margin: 0 auto 6px;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: bold;
            color: #382a23;
            margin: 0;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 5px;
        }

        #notebook-container {
            width: 100%;
            max-width: 480px;
            height: 75vh;
            background: #3b2a24;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 16px;
        }

        #notebook-header {
            color: #ffffff;
            padding: 8px 5px 15px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #notes-list {
            flex: 1;
            padding: 15px 5px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-card {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .note-title {
            font-size: 15px;
            font-weight: bold;
            color: #f7f5f2;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .note-body {
            font-size: 13px;
            font-family: Arial, sans-serif;
            color: #eadecc;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .note-media {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            max-height: 220px;
            object-fit: cover;
            display: block;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }

        .delete-note-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
        }

        /* Área de Criação de Nota */
        #note-input-area {
            display: flex;
            flex-direction: column;
            padding-top: 12px;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #note-title-input, #note-text-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 12px;
            outline: none;
            font-size: 13px;
            font-family: Arial, sans-serif;
        }

        #note-title-input::placeholder, #note-text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .file-label {
            cursor: pointer;
            font-size: 18px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }

        .file-label:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #media-input {
            display: none;
        }

        #save-note-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            font-family: Arial, sans-serif;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.3);
        }

        #save-note-btn:hover {
            background: #20ba5a;
        }

        #file-name-display {
            font-size: 11px;
            color: #eadecc;
            font-family: Arial, sans-serif;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header class="brand-header">
        <img src="imagens/Logotipo Monograma Elegante Preto.png" class="brand-logo-img" alt="Logo Ally">
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">NOTEBOOK DE ANOTAÇÕES</p>
    </header>

    <div id="notebook-container">
        <div id="notebook-header">
            <span id="notebook-title">Anotações</span>
            <a href="proxima_pagina.html" style="color: #eadecc; font-size: 12px; text-decoration: underline;">← Voltar ao Painel</a>
        </div>

        <div id="notes-list"></div>
        
        <div id="note-input-area">
            <input type="text" id="note-title-input" placeholder="Título da anotação...">
            <textarea id="note-text-input" placeholder="Escreva os detalhes, ideias ou fornecedores..." rows="2" style="resize: none;"></textarea>
            
            <div class="input-row">
                <label for="media-input" class="file-label">
                    📎 Anexar Foto/Vídeo
                </label>
                <input type="file" id="media-input" accept="image/*,video/*" onchange="mostrarNomeArquivo(this)">
                <span id="file-name-display">Nenhum ficheiro</span>
                
                <button id="save-note-btn" onclick="handleSaveNote()" style="margin-left: auto;">Salvar Nota</button>
            </div>
        </div>
    </div>

<script>
    const notesList = document.getElementById('notes-list');
    const titleInput = document.getElementById('note-title-input');
    const textInput = document.getElementById('note-text-input');
    const mediaInput = document.getElementById('media-input');
    const fileNameDisplay = document.getElementById('file-name-display');
    const casalAtivo = localStorage.getItem('casal_ativo') || 'Geral';

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('notebook-title').innerText = `Notebook (${casalAtivo})`;
        loadNotesFromSupabase();
    });

    function mostrarNomeArquivo(input) {
        if (input.files && input.files[0]) {
            fileNameDisplay.innerText = input.files[0].name;
        } else {
            fileNameDisplay.innerText = 'Nenhum ficheiro';
        }
    }

    async function loadNotesFromSupabase() {
        const { data, error } = await _supabase
            .from('notas_notebook')
            .select('*')
            .eq('casal_nome', casalAtivo)
            .order('id', { ascending: false });

        if (error) {
            console.error("Erro ao carregar notas:", error);
            return;
        }

        notesList.innerHTML = '';
        if (data && data.length > 0) {
            data.forEach(note => {
                appendNoteToDOM(note);
            });
        } else {
            notesList.innerHTML = `<p style="text-align:center;color:rgba(255,255,255,0.4);font-size:13px;padding:20px;">Nenhuma anotação guardada ainda.</p>`;
        }
    }

    function appendNoteToDOM(note) {
        const card = document.createElement('div');
        card.classList.add('note-card');

        let mediaHTML = '';
        if (note.arquivo_url) {
            if (note.tipo_arquivo === 'video') {
                mediaHTML = `<video src="${note.arquivo_url}" controls class="note-media"></video>`;
            } else {
                mediaHTML = `<img src="${note.arquivo_url}" class="note-media">`;
            }
        }

        card.innerHTML = `
            ${note.titulo ? `<div class="note-title">${note.titulo}</div>` : ''}
            ${note.conteudo ? `<div class="note-body">${note.conteudo}</div>` : ''}
            ${mediaHTML}
            <div class="note-footer">
                <span>${new Date(note.created_at).toLocaleDateString('pt-BR')}</span>
                <button class="delete-note-btn" onclick="deleteNote(${note.id})">🗑️ Apagar</button>
            </div>
        `;
        notesList.appendChild(card);
    }

    function handleSaveNote() {
        const title = titleInput.value.trim();
        const text = textInput.value.trim();
        const file = mediaInput.files[0];

        if (!title && !text && !file) {
            alert("Escreva alguma coisa ou anexe um ficheiro antes de salvar.");
            return;
        }

        if (file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const tipo = file.type.startsWith('video') ? 'video' : 'imagem';
                await saveNoteToSupabase(title, text, e.target.result, tipo);
            };
            reader.readAsDataURL(file);
        } else {
            saveNoteToSupabase(title, text, null, null);
        }
    }

    async function saveNoteToSupabase(titulo, conteudo, arquivo_url, tipo_arquivo) {
        const { error } = await _supabase.from('notas_notebook').insert([{
            casal_nome: casalAtivo,
            titulo,
            conteudo,
            arquivo_url,
            tipo_arquivo
        }]);

        if (error) {
            console.error("Erro ao salvar nota:", error);
            alert("Erro ao guardar no banco de dados.");
            return;
        }

        titleInput.value = '';
        textInput.value = '';
        mediaInput.value = '';
        fileNameDisplay.innerText = 'Nenhum ficheiro';
        loadNotesFromSupabase();
    }

    async function deleteNote(id) {
        if (confirm("Deseja apagar esta anotação?")) {
            const { error } = await _supabase.from('notas_notebook').delete().eq('id', id);
            if (!error) {
                loadNotesFromSupabase();
            } else {
                alert("Erro ao apagar nota.");
            }
        }
    }
</script>

</body>
</html>
