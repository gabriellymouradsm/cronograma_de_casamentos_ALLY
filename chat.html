<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <title>Ally - Chat On</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #f7f5f2; /* Fundo areia/off-white padronizado */
            display: flex;
            flex-direction: column; /* Alinha a logo no topo e o chat logo abaixo */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* Estilo do bloco da logo (Header no Topo) */
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .brand-logo-img {
            width: 50px;
            height: auto;
            display: block;
            margin: 0 auto 8px;
        }

        .brand-title {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #382a23;
            margin: 0;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 6px;
        }

        /* Container do Chat */
        #chat-container {
            width: 100%;
            max-width: 420px;
            height: 70vh;
            background: #3b2a24; /* Marrom escuro padronizado com os outros cards */
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 12px;
        }

        /* Cabeçalho do Chat */
        #chat-header {
            color: #ffffff;
            padding: 12px 10px 15px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #clear-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }

        #clear-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Área das Mensagens */
        #chat-messages {
            flex: 1;
            padding: 15px 5px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Balões de Mensagem */
        .message {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 85%;
            align-self: flex-start;
            word-wrap: break-word;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.sent {
            background: rgba(255, 255, 255, 0.15);
            align-self: flex-end;
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            display: block;
        }

        /* Área de Input */
        #chat-input-area {
            display: flex;
            padding: 12px 5px 5px;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #text-input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        #text-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Ícone de Clipe para Imagem */
        .file-label {
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            color: rgba(255, 255, 255, 0.7);
            transition: 0.2s;
        }

        .file-label:hover {
            color: #ffffff;
        }

        #file-input {
            display: none;
        }

        /* Botão de Enviar */
        #send-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 0 20px;
            height: 42px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            font-family: Arial, sans-serif;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.3);
        }

        #send-btn:hover {
            background: #20ba5a;
        }
    </style>
</head>
<body>

    <!-- LOGO CENTRALIZADA NO TOPO -->
    <header class="brand-header">
        <img src="imagens/Logotipo Monograma Elegante Preto.png" class="brand-logo-img" alt="Logo Ally">
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">CRONOGRAMA DE CASAMENTO</p>
    </header>

    <!-- CONTAINER DO CHAT -->
    <div id="chat-container">
        <div id="chat-header">
            <span>Chat On</span>
            <button id="clear-btn" onclick="clearChat()">Limpar</button>
        </div>

        <div id="chat-messages"></div>
        
        <div id="chat-input-area">
            <label for="file-input" class="file-label">📎</label>
            <input type="file" id="file-input" accept="image/*">
            
            <input type="text" id="text-input" placeholder="Digite uma mensagem...">
            
            <button id="send-btn">Enviar</button>
        </div>
    </div>

<script>
    const chatMessages = document.getElementById('chat-messages');
    const textInput = document.getElementById('text-input');
    const fileInput = document.getElementById('file-input');
    const sendBtn = document.getElementById('send-btn');

    document.addEventListener('DOMContentLoaded', loadMessages);

    function appendMessage(text, imageSrc, isSaved = false) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', 'sent');

        if (text) {
            const textElement = document.createElement('p');
            textElement.textContent = text;
            messageDiv.appendChild(textElement);
        }

        if (imageSrc) {
            const imgElement = document.createElement('img');
            imgElement.src = imageSrc;
            messageDiv.appendChild(imgElement);
        }

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (!isSaved) {
            saveMessageToStorage(text, imageSrc);
        }
    }

    function handleSend() {
        const text = textInput.value.trim();
        const file = fileInput.files[0];

        if (!text && !file) return;

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                appendMessage(text, e.target.result);
            };
            reader.readAsDataURL(file);
        } else {
            appendMessage(text, null);
        }

        textInput.value = '';
        fileInput.value = '';
    }

    function saveMessageToStorage(text, imageSrc) {
        let messages = JSON.parse(localStorage.getItem('chat_history_dark')) || [];
        messages.push({ text: text, imageSrc: imageSrc });
        
        try {
            localStorage.setItem('chat_history_dark', JSON.stringify(messages));
        } catch (e) {
            alert('Limite de fotos atingido! Limpe o histórico do chat.');
        }
    }

    function loadMessages() {
        let messages = JSON.parse(localStorage.getItem('chat_history_dark')) || [];
        messages.forEach(msg => {
            appendMessage(msg.text, msg.imageSrc, true);
        });
    }

    function clearChat() {
        if (confirm('Deseja apagar as mensagens deste chat?')) {
            localStorage.removeItem('chat_history_dark');
            chatMessages.innerHTML = '';
        }
    }

    sendBtn.addEventListener('click', handleSend);
    textInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleSend();
    });
</script>

</body>
</html>
