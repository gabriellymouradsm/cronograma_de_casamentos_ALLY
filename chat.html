    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #f7f5f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .brand-logo-rings {
            width: 48px;
            height: 48px;
            margin: 0 auto 6px;
            display: block;
        }

        .brand-title {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #382a23;
            margin: 0;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 6px;
        }

        #notebook-container {
            width: 100%;
            max-width: 480px;
            height: 80vh;
            background: #3b2a24;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 16px;
        }

        #notebook-header {
            color: #ffffff;
            padding: 8px 5px 15px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .whatsapp-share-btn {
            background: #25d366;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .whatsapp-share-btn:hover {
            background: #20ba5a;
        }

        #notes-list {
            flex: 1;
            padding: 15px 5px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-card {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .note-title {
            font-size: 15px;
            font-weight: bold;
            color: #f7f5f2;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .note-body {
            font-size: 13px;
            font-family: Arial, sans-serif;
            color: #eadecc;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .note-media {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            max-height: 220px;
            object-fit: cover;
            display: block;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }

        .delete-note-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
        }

        /* Área de Criação de Nota */
        #note-input-area {
            display: flex;
            flex-direction: column;
            padding-top: 12px;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #note-title-input, #note-text-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 12px;
            outline: none;
            font-size: 13px;
            font-family: Arial, sans-serif;
        }

        #note-title-input::placeholder, #note-text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .file-label {
            cursor: pointer;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }

        .file-label:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #media-input {
            display: none;
        }

        #save-note-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            font-family: Arial, sans-serif;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.3);
        }

        #save-note-btn:hover {
            background: #20ba5a;
        }

        #file-name-display {
            font-size: 11px;
            color: #eadecc;
            font-family: Arial, sans-serif;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== ESTILO IDÊNTICO AO MODAL DE CONFIRMAÇÃO DO ALLY ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-overlay.ativo {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: #fffaf5;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 22px 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            text-align: center;
            box-sizing: border-box;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.ativo .modal-card {
            transform: scale(1);
        }

        .modal-icon-container {
            width: 50px;
            height: 50px;
            background-color: #f7ecd7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
            color: #b08d4b;
            font-size: 22px;
            font-family: Georgia, serif;
            font-weight: bold;
        }

        .modal-titulo {
            font-family: Georgia, serif;
            font-size: 1.1rem;
            font-weight: bold;
            color: #382a23;
            margin-bottom: 6px;
        }

        .modal-mensagem {
            font-size: 0.8rem;
            color: #725a4d;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .modal-botoes {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            text-align: center;
        }

        .modal-btn-cancelar {
            background-color: #eadecc;
            color: #3b2a22;
        }

        .modal-btn-cancelar:hover {
            background-color: #d8c7b3;
        }

        .modal-btn-confirmar {
            background-color: #a83838;
            color: #ffffff;
        }

        .modal-btn-confirmar:hover {
            background-color: #922f2f;
        }
    </style>
</head>
<body>

    <!-- MODAL DE CONFIRMAÇÃO ELEGANTE -->
    <div class="modal-overlay" id="modalConfirmacao">
        <div class="modal-card">
            <div class="modal-icon-container">?</div>
            <div class="modal-titulo" id="modalTituloText">Confirmação</div>
            <div class="modal-mensagem" id="modalMensagemText">Deseja realmente realizar esta ação?</div>
            <div class="modal-botoes">
                <button class="modal-btn modal-btn-cancelar" onclick="fecharModalConfirmacao()">CANCELAR</button>
                <button class="modal-btn modal-btn-confirmar" id="modalBtnConfirmar" onclick="executarAcaoConfirmada()">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <header class="brand-header">
        <svg class="brand-logo-rings" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M35 50C46.0457 50 55 41.0457 55 30C55 18.9543 46.0457 10 35 10C23.9543 10 15 18.9543 15 30C15 41.0457 23.9543 50 35 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M65 50C76.0457 50 85 41.0457 85 30C85 18.9543 76.0457 10 65 10C53.9543 10 45 18.9543 45 30C45 41.0457 53.9543 50 65 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="3" fill="#c5a059"/>
        </svg>
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">NOTEBOOK DE ANOTAÇÕES</p>
    </header>

    <div id="notebook-container">
        <div id="notebook-header">
            <span id="notebook-title">Anotações</span>
            <div class="header-actions">
                <button class="whatsapp-share-btn" onclick="compartilharNotebookWhatsApp()">
                    Enviar no WhatsApp
                </button>
                <a href="proxima_pagina.html" style="color: #eadecc; font-size: 12px; text-decoration: underline;">← Voltar</a>
            </div>
        </div>

        <div id="notes-list"></div>
        
        <div id="note-input-area">
            <input type="text" id="note-title-input" placeholder="Título da anotação...">
            <textarea id="note-text-input" placeholder="Escreva os detalhes, ideias ou fornecedores..." rows="2" style="resize: none;"></textarea>
            
            <div class="input-row">
                <label for="media-input" class="file-label">
                    Anexar Foto/Vídeo
                </label>
                <input type="file" id="media-input" accept="image/*,video/*" onchange="mostrarNomeArquivo(this)">
                <span id="file-name-display">Nenhum ficheiro</span>
                
                <button id="save-note-btn" onclick="handleSaveNote()" style="margin-left: auto;">Salvar Nota</button>
            </div>
        </div>
    </div>

<script>
    const notesList = document.getElementById('notes-list');
    const titleInput = document.getElementById('note-title-input');
    const textInput = document.getElementById('note-text-input');
    const mediaInput = document.getElementById('media-input');
    const fileNameDisplay = document.getElementById('file-name-display');
    const casalAtivo = localStorage.getItem('casal_ativo') || 'Geral';
    let funcaoCallbackPendente = null;

    let notasCache = [];

    function abrirModalConfirmacao(titulo, mensagem, callback) {
        document.getElementById('modalTituloText').textContent = titulo;
        document.getElementById('modalMensagemText').textContent = mensagem;
        funcaoCallbackPendente = callback;
        document.getElementById('modalConfirmacao').classList.add('ativo');
    }

    function fecharModalConfirmacao() {
        document.getElementById('modalConfirmacao').classList.remove('ativo');
        funcaoCallbackPendente = null;
    }

    function executarAcaoConfirmada() {
        if (funcaoCallbackPendente) {
            funcaoCallbackPendente();
        }
        fecharModalConfirmacao();
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('notebook-title').innerText = `Notebook (${casalAtivo})`;
        loadNotesFromSupabase();
    });

    function mostrarNomeArquivo(input) {
        if (input.files && input.files[0]) {
            fileNameDisplay.innerText = input.files[0].name;
        } else {
            fileNameDisplay.innerText = 'Nenhum ficheiro';
        }
    }

    async function loadNotesFromSupabase() {
        const { data, error } = await _supabase
            .from('notas_notebook')
            .select('*')
            .eq('casal_nome', casalAtivo)
            .order('id', { ascending: false });

        if (error) {
            console.error("Erro ao carregar notas:", error);
            return;
        }

        notasCache = data || [];
        notesList.innerHTML = '';
        if (notasCache.length > 0) {
            notasCache.forEach(note => {
                appendNoteToDOM(note);
            });
        } else {
            notesList.innerHTML = `<p style="text-align:center;color:rgba(255,255,255,0.4);font-size:13px;padding:20px;">Nenhuma anotação guardada ainda.</p>`;
        }
    }

    function appendNoteToDOM(note) {
        const card = document.createElement('div');
        card.classList.add('note-card');

        let mediaHTML = '';
        if (note.arquivo_url) {
            if (note.tipo_arquivo === 'video') {
                mediaHTML = `<video src="${note.arquivo_url}" controls class="note-media"></video>`;
            } else {
                mediaHTML = `<img src="${note.arquivo_url}" class="note-media">`;
            }
        }

        card.innerHTML = `
            ${note.titulo ? `<div class="note-title">${note.titulo}</div>` : ''}
            ${note.conteudo ? `<div class="note-body">${note.conteudo}</div>` : ''}
            ${mediaHTML}
            <div class="note-footer">
                <span>${new Date(note.created_at).toLocaleDateString('pt-BR')}</span>
                <button class="delete-note-btn" onclick="confirmarDeletarNota(${note.id})">Apagar</button>
            </div>
        `;
        notesList.appendChild(card);
    }

    function compartilharNotebookWhatsApp() {
        if (notasCache.length === 0) {
            alert("Não existem anotações no notebook para partilhar.");
            return;
        }

        let mensagem = "*RESUMO DO NOTEBOOK — CASAMENTO*\n";
        mensagem += "*Casal:* " + casalAtivo + "\n\n";
        mensagem += "Olá, equipe! Seguem registradas as anotações, ideias e observações estratégicas para o nosso evento:\n\n";
        mensagem += "────────────────────────\n";

        notasCache.forEach((note) => {
            if (note.titulo) {
                mensagem += "*" + note.titulo + "*\n";
            }
            if (note.conteudo) {
                mensagem += note.conteudo + "\n";
            }
            mensagem += "────────────────────────\n";
        });

        mensagem += "\n*Planejamento e organização em tempo real via Ally*";

        const urlWhatsApp = "https://wa.me/?text=" + encodeURIComponent(mensagem);
        window.open(urlWhatsApp, "_blank");
    }

    function handleSaveNote() {
        const title = titleInput.value.trim();
        const text = textInput.value.trim();
        const file = mediaInput.files[0];

        if (!title && !text && !file) {
            alert("Escreva alguma coisa ou anexe um ficheiro antes de salvar.");
            return;
        }

        if (file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const tipo = file.type.startsWith('video') ? 'video' : 'imagem';
                await saveNoteToSupabase(title, text, e.target.result, tipo);
            };
            reader.readAsDataURL(file);
        } else {
            saveNoteToSupabase(title, text, null, null);
        }
    }

    async function saveNoteToSupabase(titulo, conteudo, arquivo_url, tipo_arquivo) {
        const { error } = await _supabase.from('notas_notebook').insert([{
            casal_nome: casalAtivo,
            titulo,
            conteudo,
            arquivo_url,
            tipo_arquivo
        }]);

        if (error) {
            console.error("Erro ao salvar nota:", error);
            alert("Erro ao guardar no banco de dados.");
            return;
        }

        titleInput.value = '';
        textInput.value = '';
        mediaInput.value = '';
        fileNameDisplay.innerText = 'Nenhum ficheiro';
        loadNotesFromSupabase();
    }

    function confirmarDeletarNota(id) {
        abrirModalConfirmacao("Apagar Nota", "Deseja realmente apagar esta anotação?", async () => {
            const { error } = await _supabase.from('notas_notebook').delete().eq('id', id);
            if (!error) {
                loadNotesFromSupabase();
            } else {
                alert("Erro ao apagar nota.");
            }
        });
    }
</script>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registado com sucesso:', reg.scope))
                .catch(err => console.log('Falha ao registar o Service Worker:', err));
        });
    }
</script>

</body>
