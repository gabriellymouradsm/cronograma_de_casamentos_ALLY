<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ally - Check List</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', serif; }
        body { background-color: #f7f5f2; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 30px 20px; }
        
        .brand-header { text-align: center; margin-bottom: 25px; width: 100%; }
        .brand-logo-rings { width: 48px; height: 48px; margin: 0 auto 6px; display: block; }
        .brand-title { font-size: 2.2rem; font-weight: bold; color: #382a23; margin: 0; line-height: 1; }
        .brand-tagline { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: #725a4d; margin-top: 6px; }

        .todo-container { width: 100%; max-width: 450px; background-color: #3b2a24; border-radius: 24px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; }
        h2 { color: #ffffff; font-size: 24px; margin-bottom: 20px; text-align: center; }
        #task-input { width: 100%; padding: 12px 20px; background-color: #fcfaf7; border: none; border-radius: 30px; font-size: 16px; color: #3b2a24; text-align: center; outline: none; margin-bottom: 15px; }
        #add-btn { background-color: #fcfaf7; color: #3b2a24; border: none; padding: 8px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 25px; }
        #list-container { width: 100%; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; margin-bottom: 25px; }
        .task-item { display: flex; align-items: center; justify-content: space-between; color: #ffffff; font-family: Arial, sans-serif; font-size: 16px; }
        .task-content { display: flex; align-items: center; gap: 15px; cursor: pointer; flex: 1; }
        .task-item.completed span { text-decoration: line-through; opacity: 0.5; }
        .footer-navigation { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        #edit-btn { width: 100%; max-width: 200px; background-color: #fcfaf7; color: #3b2a24; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .back-link { color: #eadecc; font-size: 12px; text-decoration: underline; }
    </style>
</head>
<body>

    <header class="brand-header">
        <svg class="brand-logo-rings" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M35 50C46.0457 50 55 41.0457 55 30C55 18.9543 46.0457 10 35 10C23.9543 10 15 18.9543 15 30C15 41.0457 23.9543 50 35 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M65 50C76.0457 50 85 41.0457 85 30C85 18.9543 76.0457 10 65 10C53.9543 10 45 18.9543 45 30C45 41.0457 53.9543 50 65 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="3" fill="#c5a059"/>
        </svg>
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">CRONOGRAMA DE CASAMENTO</p>
    </header>

    <div class="todo-container">
        <h2>Check List</h2>
        <input type="text" id="task-input" placeholder="Digite a nova tarefa">
        <button id="add-btn" onclick="addTask()">Nova Tarefa</button>
        <div id="list-container"></div>
        <div class="footer-navigation">
            <button id="edit-btn" onclick="toggleEditMode()">Editar</button>
            <a href="proxima_pagina.html" class="back-link">← Voltar ao Painel</a>
        </div>
    </div>

<script>
    const casalAtivo = localStorage.getItem('casal_ativo') || 'Geral';
    let isEditingMode = false;

    document.addEventListener('DOMContentLoaded', loadTasksFromSupabase);

    async function addTask() {
        if (isEditingMode) return;
        const text = document.getElementById('task-input').value.trim();
        if (!text) return;

        await _supabase.from('checklist').insert([{ text, checked: false, casal_nome: casalAtivo }]);
        document.getElementById('task-input').value = "";
        loadTasksFromSupabase();
    }

    async function loadTasksFromSupabase() {
        const { data } = await _supabase.from('checklist').select('*').eq('casal_nome', casalAtivo);
        const container = document.getElementById('list-container');
        container.innerHTML = '';
        const tasks = data || [];

        tasks.forEach(task => {
            const item = document.createElement('div');
            item.className = `task-item ${task.checked ? 'completed' : ''}`;
            item.innerHTML = `
                <div class="task-content" onclick="toggleTask(${task.id}, ${task.checked})">
                    <input type="checkbox" ${task.checked ? 'checked' : ''} style="pointer-events:none;">
                    <span>${task.text}</span>
                </div>
                ${isEditingMode ? `<button onclick="deleteTask(${task.id})" style="background:none;border:none;color:#ff6b6b;cursor:pointer;">🗑️</button>` : ''}
            `;
            container.appendChild(item);
        });

        localStorage.setItem('checklist_dados', JSON.stringify(tasks.map(t => ({ tarefa: t.text, status: t.checked ? 'Concluído' : 'Pendente' }))));
    }

    async function toggleTask(id, current) {
        if (isEditingMode) return;
        await _supabase.from('checklist').update({ checked: !current }).eq('id', id);
        loadTasksFromSupabase();
    }

    async function deleteTask(id) {
        await _supabase.from('checklist').delete().eq('id', id);
        loadTasksFromSupabase();
    }

    function toggleEditMode() {
        isEditingMode = !isEditingMode;
        document.getElementById('edit-btn').textContent = isEditingMode ? "Salvar" : "Editar";
        loadTasksFromSupabase();
    }
</script>
</body>
</html>
