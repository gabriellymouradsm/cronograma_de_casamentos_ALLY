<html lang="pt-BR">
<head>

    <link rel="icon" type="image/png" sizes="32x32" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/Logotipo Monograma Elegante Preto.png">

    <title>Ally - Fornecedores</title>

    <!-- Biblioteca e Conexão do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    <!-- Biblioteca SheetJS para Leitura de Arquivos Excel / CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #f7f5f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .brand-logo-rings {
            width: 48px;
            height: 48px;
            margin: 0 auto 6px;
            display: block;
        }

        .brand-title {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #382a23;
            margin: 0;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 6px;
        }

        .suppliers-container {
            width: 100%;
            max-width: 520px;
            min-height: 560px;
            background-color: #3b2a24;
            border-radius: 28px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 22px;
            text-align: center;
        }

        /* Bloco de Importação por Planilha */
        .excel-import-box {
            width: 100%;
            background-color: #47362e;
            border: 1px solid #5d463b;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .excel-import-box p {
            font-size: 11px;
            color: #d1c4bc;
            margin-bottom: 8px;
            font-family: Arial, sans-serif;
            font-weight: 500;
        }

        .excel-btn {
            background-color: #d9fdd3;
            color: #128c7e;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
            font-family: Arial, sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .excel-btn:hover {
            background-color: #c2f7b8;
        }

        .excel-btn:active {
            transform: scale(0.97);
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .input-field {
            padding: 12px 14px;
            background-color: #fcfaf7;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            color: #3b2a24;
            outline: none;
            font-family: Arial, sans-serif;
        }

        .input-field::placeholder {
            color: #b5ada5;
            font-style: italic;
            font-family: 'Georgia', serif;
        }

        .input-half {
            flex: 1;
        }

        select.input-field {
            cursor: pointer;
            color: #3b2a24;
            font-weight: 500;
        }

        #add-btn {
            width: 100%;
            background-color: #fcfaf7;
            color: #3b2a24;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
            text-transform: uppercase;
        }

        #add-btn:hover {
            background-color: #f2eee9;
        }

        /* Barra de Busca / Filtro */
        .search-box {
            width: 100%;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 11px 14px;
            background-color: #47362e;
            border: 1px solid #5d463b;
            border-radius: 12px;
            font-size: 13px;
            color: #ffffff;
            outline: none;
            font-family: Arial, sans-serif;
        }

        .search-input::placeholder {
            color: #b5ada5;
            font-style: italic;
            font-family: 'Georgia', serif;
        }

        #suppliers-list {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .supplier-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .supplier-name {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            margin-bottom: 2px;
        }

        .supplier-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .supplier-category {
            background-color: #fcfaf7;
            color: #3b2a24;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
        }

        .supplier-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #eadecc;
            font-family: Arial, sans-serif;
        }

        /* Container do Horário */
        .time-input-container {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .time-input-container span {
            font-size: 11px;
            color: #d1c4bc;
        }

        .card-time-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 12px;
            outline: none;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }

        /* Campo de Observações embaixo do Horário */
        .card-notes-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            color: #ffffff;
            outline: none;
            font-family: Arial, sans-serif;
            resize: vertical;
            min-height: 34px;
        }

        .card-notes-input::placeholder {
            color: #b5ada5;
            font-style: italic;
            font-family: 'Georgia', serif;
        }

        .status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .status-confirmado {
            background-color: #d9fdd3;
            color: #128c7e;
        }

        .status-pendente {
            background-color: #fff3cd;
            color: #856404;
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            padding: 2px;
            transition: transform 0.2s;
        }

        .edit-btn {
            color: #d1c4bc;
        }

        .edit-btn:hover {
            color: #ffffff;
            transform: scale(1.15);
        }

        .delete-btn {
            color: #ff6b6b;
        }

        .delete-btn:hover {
            transform: scale(1.15);
        }

        /* Estilo do Modal de Edição */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background-color: #3b2a24;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-card h3 {
            color: #ffffff;
            font-size: 20px;
            text-align: center;
            font-family: 'Georgia', serif;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            text-transform: uppercase;
        }

        .modal-save-btn {
            background-color: #fcfaf7;
            color: #3b2a24;
        }

        .modal-cancel-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .footer-navigation {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: auto;
        }

        .clear-all-btn {
            width: 100%;
            max-width: 200px;
            background-color: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-all-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .back-link {
            color: #eadecc;
            font-size: 12px;
            text-decoration: underline;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <header class="brand-header">
        <svg class="brand-logo-rings" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M35 50C46.0457 50 55 41.0457 55 30C55 18.9543 46.0457 10 35 10C23.9543 10 15 18.9543 15 30C15 41.0457 23.9543 50 35 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M65 50C76.0457 50 85 41.0457 85 30C85 18.9543 76.0457 10 65 10C53.9543 10 45 18.9543 45 30C45 41.0457 53.9543 50 65 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="3" fill="#c5a059"/>
        </svg>
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">PLANEJAMENTO DE CASAMENTO</p>
    </header>

    <div class="suppliers-container">
        <h2>Fornecedores</h2>
        
        <!-- Bloco de Importação por Planilha (Admin Apenas) -->
        <div class="excel-import-box" id="admin-excel-box">
            <p>Possui uma planilha com os fornecedores em Excel ou CSV?</p>
            <input type="file" id="excel-input" accept=".xlsx, .xls, .csv" class="hidden" style="display: none;" onchange="handleExcelUpload(event)">
            <button type="button" class="excel-btn" onclick="triggerExcelClick()">
                📥 IMPORTAR LISTA (EXCEL / CSV)
            </button>
        </div>

        <!-- Formulário de Cadastro (Admin Apenas) -->
        <div class="form-grid" id="admin-form-section">
            <div class="input-row">
                <input type="text" id="category-input" class="input-field input-half" placeholder="Serviço (ex: Buffet)">
                <input type="text" id="name-input" class="input-field input-half" placeholder="Nome do Fornecedor">
            </div>
            
            <div class="input-row">
                <input type="text" id="phone-input" class="input-field input-half" placeholder="Telefone / Whats">
                <select id="status-select" class="input-field input-half">
                    <option value="Pendente">Status: Pendente</option>
                    <option value="Confirmado">Status: Confirmado</option>
                </select>
            </div>
            <button id="add-btn">Adicionar Fornecedor</button>
        </div>

        <!-- Barra de Busca / Filtro -->
        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar por nome do responsável ou serviço..." oninput="renderSuppliers()">
        </div>
        
        <div id="suppliers-list"></div>
        
        <div class="footer-navigation">
            <button class="clear-all-btn" id="btn-clear-all" onclick="clearAll()">Limpar Todos</button>
            <a href="proxima_pagina.html" class="back-link">← Voltar ao Painel</a>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Editar Fornecedor</h3>
            <input type="text" id="edit-category" class="input-field" placeholder="Serviço (ex: Buffet)">
            <input type="text" id="edit-name" class="input-field" placeholder="Nome do Fornecedor">
            <input type="text" id="edit-phone" class="input-field" placeholder="Telefone / Whats">
            <select id="edit-status" class="input-field">
                <option value="Pendente">Status: Pendente</option>
                <option value="Confirmado">Status: Confirmado</option>
            </select>
            <div class="modal-actions">
                <button type="button" class="modal-btn modal-cancel-btn" onclick="closeEditModal()">Cancelar</button>
                <button type="button" class="modal-btn modal-save-btn" onclick="saveEditedSupplier()">Salvar</button>
            </div>
        </div>
    </div>

<script>
    const categoryInput = document.getElementById('category-input');
    const nameInput = document.getElementById('name-input');
    const phoneInput = document.getElementById('phone-input');
    const statusSelect = document.getElementById('status-select');
    const addBtn = document.getElementById('add-btn');
    const suppliersList = document.getElementById('suppliers-list');
    const searchInput = document.getElementById('search-input');
    const userRole = localStorage.getItem('user_role');

    let suppliers = [];
    let editingId = null;

    document.addEventListener('DOMContentLoaded', () => {
        if (userRole === 'assistant') {
            document.getElementById('admin-excel-box').style.display = 'none';
            document.getElementById('admin-form-section').style.display = 'none';
            document.getElementById('btn-clear-all').style.display = 'none';
        }
        loadSuppliersFromSupabase();
    });

    async function loadSuppliersFromSupabase() {
        const { data, error } = await _supabase.from('fornecedores').select('*');
        if (error) {
            console.error("Erro ao carregar fornecedores:", error);
            return;
        }
        suppliers = data || [];
        sortSuppliers();
        renderSuppliers();
        updatePDFStorage();
    }

    function sortSuppliers() {
        suppliers.sort((a, b) => a.name.trim().localeCompare(b.name.trim(), 'pt-BR', { sensitivity: 'accent' }));
    }

    function updatePDFStorage() {
        const pdfSuppliersData = suppliers.map(s => ({
            categoria: s.category,
            nome: s.name,
            contato: `${s.phone ? '📞 ' + s.phone + ' ' : ''}${s.time ? '⏰ ' + s.time : ''}${s.notes ? ' | Obs: ' + s.notes : ''} (${s.status})`.trim()
        }));
        localStorage.setItem('fornecedores_dados', JSON.stringify(pdfSuppliersData));
    }

    async function addSupplier() {
        if (userRole === 'assistant') return;

        const category = categoryInput.value.trim();
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        const status = statusSelect.value;

        if (!category || !name) {
            alert("Por favor, preencha pelo menos o tipo de serviço e o nome do fornecedor.");
            return;
        }

        const { error } = await _supabase.from('fornecedores').insert([{
            category, name, phone, time: "", notes: "", status
        }]);

        if (error) {
            console.error("Erro ao adicionar fornecedor:", error);
            return;
        }

        categoryInput.value = "";
        nameInput.value = "";
        phoneInput.value = "";
        statusSelect.value = "Pendente";
        categoryInput.focus();

        loadSuppliersFromSupabase();
    }

    function renderSuppliers() {
        suppliersList.innerHTML = '';
        const searchTerm = searchInput.value.toLowerCase().trim();

        const filteredSuppliers = suppliers.filter(s => 
            s.name.toLowerCase().includes(searchTerm) || 
            s.category.toLowerCase().includes(searchTerm) ||
            s.phone.toLowerCase().includes(searchTerm) ||
            (s.time && s.time.includes(searchTerm)) ||
            (s.notes && s.notes.toLowerCase().includes(searchTerm))
        );

        if (filteredSuppliers.length === 0) {
            suppliersList.innerHTML = `<p style="text-align: center; color: #b5ada5; font-size: 13px; padding: 20px;">Nenhum fornecedor encontrado.</p>`;
            return;
        }

        filteredSuppliers.forEach((s) => {
            const itemDiv = document.createElement('div');
            itemDiv.classList.add('supplier-item');

            const nameSpan = document.createElement('span');
            nameSpan.classList.add('supplier-name');
            nameSpan.textContent = s.name;

            const headerDiv = document.createElement('div');
            headerDiv.classList.add('supplier-header');

            const categorySpan = document.createElement('span');
            categorySpan.classList.add('supplier-category');
            categorySpan.textContent = s.category;

            headerDiv.appendChild(categorySpan);

            const detailsDiv = document.createElement('div');
            detailsDiv.classList.add('supplier-details');

            const infoSpan = document.createElement('span');
            infoSpan.textContent = s.phone ? `📞 ${s.phone}` : '';

            // Container do Horário
            const timeContainer = document.createElement('div');
            timeContainer.classList.add('time-input-container');
            
            const timeLabel = document.createElement('span');
            timeLabel.textContent = '⏰';

            const timeInput = document.createElement('input');
            timeInput.type = 'time';
            timeInput.classList.add('card-time-input');
            timeInput.value = s.time || '';
            timeInput.title = 'Horário de Chegada';
            
            timeInput.addEventListener('change', async () => {
                await _supabase.from('fornecedores').update({ time: timeInput.value }).eq('id', s.id);
                loadSuppliersFromSupabase();
            });

            timeContainer.appendChild(timeLabel);
            timeContainer.appendChild(timeInput);

            // Linha de ações (Status, Editar, Excluir)
            const actionRow = document.createElement('div');
            actionRow.classList.add('action-row');

            const statusSpan = document.createElement('span');
            statusSpan.classList.add('status-badge');
            updateStatusBadge(statusSpan, s.status);

            statusSpan.addEventListener('click', async () => {
                const newStatus = s.status === 'Confirmado' ? 'Pendente' : 'Confirmado';
                await _supabase.from('fornecedores').update({ status: newStatus }).eq('id', s.id);
                loadSuppliersFromSupabase();
            });

            actionRow.appendChild(statusSpan);

            if (userRole !== 'assistant') {
                const editBtn = document.createElement('button');
                editBtn.classList.add('edit-btn');
                editBtn.innerHTML = '✏️';
                editBtn.title = 'Editar Fornecedor';
                editBtn.addEventListener('click', () => {
                    openEditModal(s.id);
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.classList.add('delete-btn');
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.title = 'Remover Fornecedor';
                deleteBtn.addEventListener('click', async () => {
                    if (confirm(`Deseja realmente remover o fornecedor "${s.name}"?`)) {
                        await _supabase.from('fornecedores').delete().eq('id', s.id);
                        loadSuppliersFromSupabase();
                    }
                });

                actionRow.appendChild(editBtn);
                actionRow.appendChild(deleteBtn);
            }

            detailsDiv.appendChild(infoSpan);
            detailsDiv.appendChild(timeContainer);

            // Campo de Observações embaixo do horário
            const notesInput = document.createElement('textarea');
            notesInput.classList.add('card-notes-input');
            notesInput.placeholder = 'Adicionar observações (ex: portão lateral, restrições...)';
            notesInput.value = s.notes || '';

            notesInput.addEventListener('blur', async () => {
                await _supabase.from('fornecedores').update({ notes: notesInput.value }).eq('id', s.id);
                loadSuppliersFromSupabase();
            });

            itemDiv.appendChild(nameSpan);
            itemDiv.appendChild(headerDiv);
            itemDiv.appendChild(detailsDiv);
            itemDiv.appendChild(notesInput);
            
            const footerCardRow = document.createElement('div');
            footerCardRow.style.display = 'flex';
            footerCardRow.style.justifyContent = 'space-between';
            footerCardRow.style.alignItems = 'center';
            footerCardRow.style.width = '100%';
            footerCardRow.style.marginTop = '2px';
            
            const emptyPlaceholder = document.createElement('span');
            footerCardRow.appendChild(emptyPlaceholder);
            footerCardRow.appendChild(actionRow);

            itemDiv.appendChild(footerCardRow);

            suppliersList.appendChild(itemDiv);
        });
    }

    function openEditModal(id) {
        if (userRole === 'assistant') return;
        editingId = id;
        const s = suppliers.find(item => item.id === id);
        if (!s) return;

        document.getElementById('edit-category').value = s.category;
        document.getElementById('edit-name').value = s.name;
        document.getElementById('edit-phone').value = s.phone || '';
        document.getElementById('edit-status').value = s.status;
        document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('edit-modal').style.display = 'none';
        editingId = null;
    }

    async function saveEditedSupplier() {
        if (userRole === 'assistant' || editingId === null) return;

        const newCategory = document.getElementById('edit-category').value.trim();
        const newName = document.getElementById('edit-name').value.trim();
        const newPhone = document.getElementById('edit-phone').value.trim();
        const newStatus = document.getElementById('edit-status').value;

        if (!newCategory || !newName) {
            alert("Por favor, preencha o serviço e o nome.");
            return;
        }

        const { error } = await _supabase.from('fornecedores').update({
            category: newCategory,
            name: newName,
            phone: newPhone,
            status: newStatus
        }).eq('id', editingId);

        if (!error) {
            loadSuppliersFromSupabase();
            closeEditModal();
        }
    }

    function updateStatusBadge(element, status) {
        element.textContent = status;
        if (status === 'Confirmado') {
            element.className = 'status-badge status-confirmado';
        } else {
            element.className = 'status-badge status-pendente';
        }
    }

    function triggerExcelClick() {
        if (userRole === 'assistant') return;
        document.getElementById('excel-input').click();
    }

    function handleExcelUpload(event) {
        if (userRole === 'assistant') return;
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                if (jsonRows.length === 0) {
                    alert("A planilha selecionada está vazia.");
                    return;
                }

                let importedCount = 0;
                let newRowsToInsert = [];

                jsonRows.forEach((row) => {
                    const getVal = (possibleNames) => {
                        for (let key of Object.keys(row)) {
                            const cleanKey = key.toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                            for (let pName of possibleNames) {
                                if (cleanKey.includes(pName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""))) {
                                    const val = row[key];
                                    if (val !== undefined && val !== null && val.toString().trim() !== "") {
                                        return val.toString().trim();
                                    }
                                }
                            }
                        }
                        return "";
                    };

                    const category = getVal(["servico", "categoria", "tipo", "segmento"]) || "Serviço";
                    const name = getVal(["nome", "fornecedor", "empresa", "nome do fornecedor"]) || "";
                    const phone = getVal(["telefone", "whats", "whatsapp", "contato", "celular"]) || "";
                    const time = getVal(["horario", "hora", "chegada", "horario de chegada"]) || "";
                    const notes = getVal(["observacao", "observacoes", "obs", "detalhes"]) || "";
                    const status = getVal(["status", "situacao", "estado"]) || "Pendente";

                    if (name) {
                        newRowsToInsert.push({
                            category,
                            name,
                            phone,
                            time,
                            notes,
                            status: status.charAt(0).toUpperCase() + status.slice(1).toLowerCase()
                        });
                        importedCount++;
                    }
                });

                if (newRowsToInsert.length > 0) {
                    await _supabase.from('fornecedores').insert(newRowsToInsert);
                    loadSuppliersFromSupabase();
                    event.target.value = "";
                    alert(`${importedCount} fornecedores importados com sucesso!`);
                } else {
                    alert("Não foi possível encontrar colunas válidas.");
                }
            } catch (err) {
                console.error(err);
                alert("Erro ao ler o arquivo.");
            }
        };
        reader.readAsArrayBuffer(file);
    }

    async function clearAll() {
        if (userRole === 'assistant') return;
        if (confirm("Deseja apagar todos os fornecedores?")) {
            await _supabase.from('fornecedores').delete().neq('id', 0);
            loadSuppliersFromSupabase();
        }
    }

    if (addBtn) {
        addBtn.addEventListener('click', addSupplier);
    }
</script>
