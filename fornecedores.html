<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ally - Fornecedores</title>

    <!-- Configurações PWA e Ícones -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b2a22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ally">
    <link rel="apple-touch-icon" sizes="180x180" href="Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Logotipo Monograma Elegante Preto.png">

    <!-- Supabase e Biblioteca Excel -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', serif; }
        body { background-color: #f7f5f2; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 30px 20px; }
        
        .brand-header { text-align: center; margin-bottom: 25px; width: 100%; }
        .brand-logo-rings { width: 48px; height: 48px; margin: 0 auto 6px; display: block; }
        .brand-title { font-size: 2.2rem; font-weight: bold; color: #382a23; margin: 0; line-height: 1; }
        .brand-tagline { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: #725a4d; margin-top: 6px; }

        .suppliers-container { width: 100%; max-width: 520px; background-color: #3b2a24; border-radius: 28px; padding: 30px 25px; display: flex; flex-direction: column; align-items: center; position: relative; }
        h2 { color: #ffffff; font-size: 26px; margin-bottom: 22px; text-align: center; }
        
        .excel-import-box { width: 100%; background-color: #47362e; border: 1px solid #5d463b; border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .excel-btn { background-color: #d9fdd3; color: #128c7e; border: none; padding: 10px 16px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .divider-text { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #b5ada5; margin: 10px 0 15px; text-align: center; width: 100%; border-bottom: 1px solid #5d463b; line-height: 0.1em; }
        .divider-text span { background: #3b2a24; padding: 0 10px; }

        .form-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 15px; }
        .input-row { display: flex; gap: 10px; width: 100%; }
        .input-field { padding: 12px 14px; background-color: #fcfaf7; border: none; border-radius: 12px; font-size: 14px; color: #382a23; outline: none; width: 100%; }
        .input-half { flex: 1; }
        
        .action-row { display: flex; gap: 10px; width: 100%; margin-top: 5px; }
        .btn-action { flex: 1; background-color: #fcfaf7; color: #3b2a24; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 13px; text-align: center; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .btn-action:hover { background-color: #f2eee9; }
        
        .search-input { width: 100%; padding: 11px 14px; background-color: #47362e; border: 1px solid #5d463b; border-radius: 12px; font-size: 13px; color: #ffffff; outline: none; margin-bottom: 15px; }
        .search-input::placeholder { color: #b5ada5; }

        #suppliers-list { width: 100%; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; margin-bottom: 15px; }
        
        .supplier-item { background: rgba(255,255,255,0.06); padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 8px; }
        .supplier-name { color: #ffffff; font-size: 16px; font-weight: bold; font-family: Arial, sans-serif; }
        .supplier-header { display: flex; justify-content: space-between; align-items: center; }
        .supplier-category { background-color: #fcfaf7; color: #3b2a24; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .supplier-details { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #eadecc; font-family: Arial, sans-serif; }
        .time-input-container { display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 8px; }
        .card-time-input { background: transparent; border: none; color: #ffffff; font-size: 12px; outline: none; }
        
        .supplier-note-line {
            color: #d1c4bc;
            font-size: 13px;
            font-family: Arial, sans-serif;
            font-style: italic;
            display: block;
            margin-top: 2px;
        }

        .card-occurrence-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 6px;
        }

        .card-occurrence-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            color: #ffffff;
            outline: none;
            font-family: Arial, sans-serif;
            resize: vertical;
            min-height: 34px;
        }

        .card-occurrence-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        .save-occurrence-btn {
            align-self: flex-end;
            background-color: #fcfaf7;
            color: #3b2a24;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
        }

        .save-occurrence-btn:hover {
            background-color: #f2eee9;
        }

        .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; user-select: none; }
        .status-confirmado { background-color: #d9fdd3; color: #128c7e; }
        .status-pendente { background-color: #fff3cd; color: #856404; }

        .footer-navigation { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; }
        .clear-all-btn { background: transparent; color: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.3); padding: 10px; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; max-width: 200px; text-transform: uppercase; }
        .clear-all-btn:hover { background-color: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .back-link { color: #eadecc; font-size: 12px; text-decoration: underline; margin-top: 15px; }

        /* ===== MODAL COM A PALETA DE CORES EXATA DO APLICATIVO ===== */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 20, 15, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .custom-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .custom-modal-box {
            background-color: #fcfaf7; /* Fundo creme/bege padrão do app */
            border-radius: 28px;
            width: 90%;
            max-width: 320px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .custom-modal-overlay.active .custom-modal-box {
            transform: scale(1);
        }
        .custom-modal-header {
            padding: 30px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .custom-modal-icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }
        /* Cores de sucesso e erro usando a identidade do app */
        .success-theme .custom-modal-icon-circle {
            background-color: #d9fdd3;
            color: #128c7e;
        }
        .error-theme .custom-modal-icon-circle {
            background-color: #fae1dd;
            color: #a83232;
        }
        .custom-modal-body {
            padding: 0 24px 24px;
        }
        .custom-modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #3b2a24; /* Marrom escuro institucional do Ally */
            margin-bottom: 8px;
        }
        .custom-modal-message {
            color: #725a4d; /* Marrom claro secundário do app */
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 22px;
            font-family: Arial, sans-serif;
        }
        .custom-modal-btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        .success-theme .custom-modal-btn {
            background-color: #128c7e;
            color: #ffffff;
        }
        .error-theme .custom-modal-btn {
            background-color: #a83232;
            color: #ffffff;
        }
        .custom-modal-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- MODAL COM CORES PERSONALIZADAS DO APP -->
    <div id="custom-modal" class="custom-modal-overlay">
        <div id="modal-box" class="custom-modal-box success-theme">
            <div class="custom-modal-header">
                <div id="modal-icon-circle" class="custom-modal-icon-circle">✓</div>
            </div>
            <div class="custom-modal-body">
                <div id="modal-title" class="custom-modal-title">Sucesso!</div>
                <div id="modal-message" class="custom-modal-message">Mensagem aqui</div>
                <button class="custom-modal-btn" onclick="closeCustomModal()">OK</button>
            </div>
        </div>
    </div>

    <header class="brand-header">
        <svg class="brand-logo-rings" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M35 50C46.0457 50 55 41.0457 55 30C55 18.9543 46.0457 10 35 10C23.9543 10 15 18.9543 15 30C15 41.0457 23.9543 50 35 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M65 50C76.0457 50 85 41.0457 85 30C85 18.9543 76.0457 10 65 10C53.9543 10 45 18.9543 45 30C45 41.0457 53.9543 50 65 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="3" fill="#c5a059"/>
        </svg>
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">PLANEJAMENTO DE CASAMENTO</p>
    </header>

    <div class="suppliers-container">
        
        <!-- TELA 1: FORMULÁRIO E IMPORTAÇÃO -->
        <div id="view-form" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <h2>Formulário de Fornecedores</h2>
            
            <div class="excel-import-box" id="admin-excel-box">
                <p style="font-size:11px;color:#d1c4bc;margin-bottom:8px;">Possui uma planilha com a lista em Excel ou CSV?</p>
                <input type="file" id="excel-input" accept=".xlsx, .xls, .csv" style="display:none;" onchange="handleExcelUpload(event)">
                <button type="button" class="excel-btn" onclick="document.getElementById('excel-input').click()">📥 Importar Lista (Excel / CSV)</button>
            </div>

            <div class="divider-text"><span style="color:#b5ada5;">Ou cadastre manualmente</span></div>

            <div class="form-grid" id="admin-form-section">
                <div class="input-row">
                    <input type="text" id="category-input" class="input-field input-half" placeholder="Serviço (ex: Buffet)">
                    <input type="text" id="name-input" class="input-field input-half" placeholder="Nome do Fornecedor">
                </div>
                <div class="input-row">
                    <input type="text" id="phone-input" class="input-field input-half" placeholder="Telefone / Whats">
                    <select id="status-select" class="input-field input-half">
                        <option value="Pendente">Status: Pendente</option>
                        <option value="Confirmado">Status: Confirmado</option>
                    </select>
                </div>
                
                <div class="action-row">
                    <button id="add-btn" class="btn-action" onclick="addSupplier()">Cadastrar</button>
                    <button class="btn-action" style="background-color: #f2eee9;" onclick="switchView('list')">Acessar a Lista</button>
                </div>
            </div>
        </div>

        <!-- TELA 2: LISTAGEM DE FORNECEDORES -->
        <div id="view-list" style="width: 100%; display: none; flex-direction: column; align-items: center;">
            <h2>Lista de Fornecedores</h2>

            <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar fornecedor..." oninput="renderSuppliers()">
            
            <div id="suppliers-list"></div>
            
            <div class="footer-navigation">
                <button class="clear-all-btn" id="btn-clear-all" onclick="clearAll()">Limpar Todos</button>
                <button class="btn-action" style="width: 100%; max-width: 200px; background-color: #fcfaf7;" onclick="switchView('form')">← Voltar ao Formulário</button>
            </div>
        </div>
        
        <a href="proxima_pagina.html" class="back-link">← Voltar ao Painel</a>
    </div>

<script>
    const userRole = localStorage.getItem('user_role');
    const casalAtivo = localStorage.getItem('casal_ativo') || 'Geral';
    let suppliers = [];

    function showModal(message, type = 'success', title = '') {
        const modal = document.getElementById('custom-modal');
        const modalBox = document.getElementById('modal-box');
        const msgEl = document.getElementById('modal-message');
        const titleEl = document.getElementById('modal-title');
        const iconEl = document.getElementById('modal-icon-circle');

        msgEl.textContent = message;

        if (type === 'success') {
            modalBox.className = 'custom-modal-box success-theme';
            titleEl.textContent = title || 'Tudo pronto!';
            iconEl.textContent = '✓';
        } else {
            modalBox.className = 'custom-modal-box error-theme';
            titleEl.textContent = title || 'Atenção';
            iconEl.textContent = '✕';
        }

        modal.classList.add('active');
    }

    function closeCustomModal() {
        const modal = document.getElementById('custom-modal');
        modal.classList.remove('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (userRole === 'assistant') {
            document.getElementById('admin-excel-box').style.display = 'none';
            document.getElementById('admin-form-section').style.display = 'none';
            document.getElementById('btn-clear-all').style.display = 'none';
        }
        loadSuppliersFromSupabase();
    });

    function switchView(target) {
        const formView = document.getElementById('view-form');
        const listView = document.getElementById('view-list');

        if (target === 'list') {
            formView.style.display = 'none';
            listView.style.display = 'flex';
            loadSuppliersFromSupabase();
        } else {
            listView.style.display = 'none';
            formView.style.display = 'flex';
        }
    }

    async function loadSuppliersFromSupabase() {
        const { data } = await _supabase.from('fornecedores').select('*').eq('casal_nome', casalAtivo);
        suppliers = data || [];
        sortSuppliers();
        renderSuppliers();
        updatePDFStorage();
    }

    function sortSuppliers() {
        suppliers.sort((a, b) => a.name.trim().localeCompare(b.name.trim(), 'pt-BR'));
    }

    function updatePDFStorage() {
        const pdfData = suppliers.map(s => {
            let contatoStr = `${s.phone ? '📞 ' + s.phone + ' ' : ''}${s.time ? '⏰ ' + s.time : ''} (${s.status})`;
            if (s.notes) {
                const linhas = s.notes.split('\n');
                linhas.forEach(l => {
                    if (l.trim()) contatoStr += ` \nobs: ${l.trim().replace(/^obs:\s*/i, '')}`;
                });
            }
            return {
                categoria: s.category,
                nome: s.name,
                contato: contatoStr.trim()
            };
        });
        localStorage.setItem('fornecedores_dados', JSON.stringify(pdfData));
    }

    async function addSupplier() {
        if (userRole === 'assistant') return;
        const category = document.getElementById('category-input').value.trim();
        const name = document.getElementById('name-input').value.trim();
        const phone = document.getElementById('phone-input').value.trim();
        const status = document.getElementById('status-select').value;

        if (!category || !name) { 
            showModal("Por favor, preencha o serviço e o nome do fornecedor.", "error", "Campos Obrigatórios"); 
            return; 
        }

        const { error } = await _supabase.from('fornecedores').insert([{ category, name, phone, time: "", notes: "", status, casal_nome: casalAtivo }]);
        
        if (error) {
            showModal("Houve um erro ao tentar cadastrar o fornecedor.", "error", "Erro no Cadastro");
            return;
        }

        showModal("Fornecedor cadastrado com sucesso!", "success", "Sucesso!");
        document.getElementById('category-input').value = "";
        document.getElementById('name-input').value = "";
        document.getElementById('phone-input').value = "";
        loadSuppliersFromSupabase();
    }

    async function handleExcelUpload(event) {
        if (userRole === 'assistant') return;
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                if (jsonRows.length === 0) {
                    showModal("O arquivo Excel selecionado está vazio.", "error", "Arquivo Vazio");
                    return;
                }

                let importadosCount = 0;
                for (let row of jsonRows) {
                    const category = row['Serviço'] || row['servico'] || row['Categoria'] || row['categoria'] || '';
                    const name = row['Nome do Fornecedor'] || row['nome'] || row['Nome'] || '';
                    const phone = String(row['Telefone / Whats'] || row['telefone'] || row['Telefone'] || row['WhatsApp'] || '');
                    let status = row['Status'] || row['status'] || 'Pendente';

                    status = status.toLowerCase().includes('confirm') ? 'Confirmado' : 'Pendente';

                    if (category.trim() && name.trim()) {
                        await _supabase.from('fornecedores').insert([{
                            category: category.trim(),
                            name: name.trim(),
                            phone: phone.trim(),
                            time: "",
                            notes: "",
                            status: status,
                            casal_nome: casalAtivo
                        }]);
                        importadosCount++;
                    }
                }

                showModal(`${importadosCount} fornecedor(es) importado(s) com sucesso!`, "success", "Importação Concluída");
                event.target.value = '';
                loadSuppliersFromSupabase();
            } catch (err) {
                console.error("Erro ao ler o arquivo Excel:", err);
                showModal("Não foi possível processar o arquivo. Verifique se o formato está correto.", "error", "Erro na Importação");
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function renderSuppliers() {
        const list = document.getElementById('suppliers-list');
        list.innerHTML = '';
        const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();

        const filtered = suppliers.filter(s => s.name.toLowerCase().includes(searchTerm) || s.category.toLowerCase().includes(searchTerm));

        if (filtered.length === 0) {
            list.innerHTML = `<p style="text-align:center;color:#b5ada5;font-size:13px;padding:20px;">Nenhum fornecedor encontrado.</p>`;
            return;
        }

        filtered.forEach(s => {
            const item = document.createElement('div');
            item.className = 'supplier-item';

            item.innerHTML = `
                <span class="supplier-name">${s.name}</span>
                <div class="supplier-header"><span class="supplier-category">${s.category}</span></div>
                <div class="supplier-details">
                    <span>📞 ${s.phone || '-'}</span>
                    <div class="time-input-container">
                        <span>⏰</span>
                        <input type="time" class="card-time-input" value="${s.time || ''}" onchange="updateTime(${s.id}, this.value)">
                    </div>
                </div>
            `;

            if (s.notes) {
                const linhasNotas = s.notes.split('\n');
                linhasNotas.forEach(linha => {
                    if (linha.trim() !== '') {
                        const noteSpan = document.createElement('span');
                        noteSpan.classList.add('supplier-note-line');
                        const textoLimpo = linha.replace(/^obs:\s*/i, '').trim();
                        noteSpan.textContent = `obs: ${textoLimpo}`;
                        item.appendChild(noteSpan);
                    }
                });
            }

            const occurrenceBox = document.createElement('div');
            occurrenceBox.classList.add('card-occurrence-box');

            const occurrenceInput = document.createElement('textarea');
            occurrenceInput.classList.add('card-occurrence-input');
            occurrenceInput.placeholder = 'Ocorrência fora do comum...';

            const saveOccurrenceBtn = document.createElement('button');
            saveOccurrenceBtn.classList.add('save-occurrence-btn');
            saveOccurrenceBtn.textContent = 'Registrar';

            saveOccurrenceBtn.addEventListener('click', async () => {
                const novoTexto = occurrenceInput.value.trim();
                if (!novoTexto) return;

                const novaNotaAtualizada = s.notes ? `${s.notes}\n${novoTexto}` : novoTexto;

                const { error } = await _supabase
                    .from('fornecedores')
                    .update({ notes: novaNotaAtualizada })
                    .eq('id', s.id);

                if (error) {
                    showModal("Erro ao registrar ocorrência.", "error", "Erro");
                    return;
                }
                loadSuppliersFromSupabase();
            });

            occurrenceBox.appendChild(occurrenceInput);
            occurrenceBox.appendChild(saveOccurrenceBtn);
            item.appendChild(occurrenceBox);

            const footerCard = document.createElement('div');
            footerCard.style.cssText = "display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:4px;";
            footerCard.innerHTML = `
                <span class="status-badge ${s.status === 'Confirmado' ? 'status-confirmado' : 'status-pendente'}" onclick="toggleStatus(${s.id}, '${s.status}')">${s.status}</span>
                ${userRole !== 'assistant' ? `<button onclick="deleteSupplier(${s.id})" style="background:none;border:none;color:#ff6b6b;cursor:pointer;">🗑️</button>` : ''}
            `;
            item.appendChild(footerCard);

            list.appendChild(item);
        });
    }

    async function updateTime(id, time) {
        await _supabase.from('fornecedores').update({ time }).eq('id', id);
        loadSuppliersFromSupabase();
    }
    async function toggleStatus(id, current) {
        const status = current === 'Confirmado' ? 'Pendente' : 'Confirmado';
        await _supabase.from('fornecedores').update({ status }).eq('id', id);
        loadSuppliersFromSupabase();
    }
    async function deleteSupplier(id) {
        if (confirm("Remover fornecedor?")) {
            await _supabase.from('fornecedores').delete().eq('id', id);
            loadSuppliersFromSupabase();
        }
    }
    async function clearAll() {
        if (confirm("Apagar todos os fornecedores?")) {
            await _supabase.from('fornecedores').delete().eq('casal_nome', casalAtivo);
            loadSuppliersFromSupabase();
        }
    }
</script>

</body>
