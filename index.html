<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ally - Login e Acesso</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #f7f5f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #382a23;
        }

        .brand-tagline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 5px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background-color: #3b2a24;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            color: #ffffff;
            text-align: center;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #faf7f2;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-primary {
            background-color: #fcfaf7;
            color: #3b2a24;
        }

        .btn-primary:hover {
            background-color: #f2eee9;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            background-color: #fcfaf7;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            color: #3b2a24;
            outline: none;
            margin-bottom: 12px;
        }

        .input-field::placeholder {
            color: #b5ada5;
            font-style: italic;
        }

        select.input-field {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .back-link {
            color: #eadecc;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header class="brand-header">
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">PLANEJAMENTO DE CASAMENTO</p>
    </header>

    <div class="card" id="view-role">
        <h2>Selecione o seu perfil</h2>
        <div class="btn-group">
            <button class="action-btn btn-primary" onclick="escolherPerfil('admin')">👑 Administrador (Casal)</button>
            <button class="action-btn btn-secondary" onclick="escolherPerfil('assistant')">📋 Assistente de Campo</button>
        </div>
    </div>

    <!-- TELA DO ADMINISTRADOR: ESCOLHER ENTRE CRIAR NOVO OU ACESSAR EXISTENTE -->
    <div class="card hidden" id="view-admin-choice">
        <h2>Área do Administrador</h2>
        <div class="btn-group">
            <button class="action-btn btn-primary" onclick="mostrarTelaCriar()">✨ Criar Novo Casal</button>
            <button class="action-btn btn-secondary" onclick="mostrarTelaSelecionar()">📂 Acessar Casal Existente</button>
        </div>
        <span class="back-link" onclick="voltarParaPerfil()">← Voltar</span>
    </div>

    <!-- TELA 1: CRIAR NOVO CASAL -->
    <div class="card hidden" id="view-criar">
        <h2>Criar Novo Casal</h2>
        <form onsubmit="salvarNovoCasal(event)">
            <input type="text" id="nome-casal" class="input-field" placeholder="Nome do Casal (ex: Ana & João)" required>
            <input type="text" id="data-casal" class="input-field" placeholder="Data (ex: 20/10/2026)" required>
            <input type="time" id="horario-casal" class="input-field" required>
            <button type="submit" class="action-btn btn-primary" style="margin-top: 5px;">Avançar para o Painel</button>
        </form>
        <span class="back-link" onclick="voltarParaAdminChoice()">← Voltar</span>
    </div>

    <!-- TELA 2: SELECIONAR CASAL JÁ EXISTENTE -->
    <div class="card hidden" id="view-selecionar">
        <h2>Selecionar Casal Existente</h2>
        <div style="margin-bottom: 15px;">
            <select id="select-casal" class="input-field">
                <option value="">A carregar casais...</option>
            </select>
        </div>
        <button class="action-btn btn-primary" onclick="entrarCasalExistente()">Entrar no Casal</button>
        <span class="back-link" onclick="voltarParaAdminChoice()">← Voltar</span>
    </div>

    <!-- TELA DO ASSISTENTE -->
    <div class="card hidden" id="view-assistente">
        <h2>Acesso Assistente</h2>
        <p style="font-size: 13px; color: #d1c4bc; margin-bottom: 15px;">Selecione o casamento que vai acompanhar:</p>
        <div style="margin-bottom: 15px;">
            <select id="select-casal-assistant" class="input-field">
                <option value="">A carregar casais...</option>
            </select>
        </div>
        <button class="action-btn btn-primary" onclick="entrarAssistente()">Entrar como Assistente</button>
        <span class="back-link" onclick="voltarParaPerfil()">← Voltar</span>
    </div>

<script>
    function escolherPerfil(role) {
        localStorage.setItem('user_role', role);
        if (role === 'admin') {
            document.getElementById('view-role').classList.add('hidden');
            document.getElementById('view-admin-choice').classList.remove('hidden');
        } else {
            carregarListaCasais('select-casal-assistant');
            document.getElementById('view-role').classList.add('hidden');
            document.getElementById('view-assistente').classList.remove('hidden');
        }
    }

    function mostrarTelaCriar() {
        document.getElementById('view-admin-choice').classList.add('hidden');
        document.getElementById('view-criar').classList.remove('hidden');
    }

    async function mostrarTelaSelecionar() {
        document.getElementById('view-admin-choice').classList.add('hidden');
        document.getElementById('view-selecionar').classList.remove('hidden');
        await carregarListaCasais('select-casal');
    }

    function voltarParaAdminChoice() {
        document.getElementById('view-criar').classList.add('hidden');
        document.getElementById('view-selecionar').classList.add('hidden');
        document.getElementById('view-admin-choice').classList.remove('hidden');
    }

    function voltarParaPerfil() {
        localStorage.clear();
        document.getElementById('view-admin-choice').classList.add('hidden');
        document.getElementById('view-criar').classList.add('hidden');
        document.getElementById('view-selecionar').classList.add('hidden');
        document.getElementById('view-assistente').classList.add('hidden');
        document.getElementById('view-role').classList.remove('hidden');
    }

    async function carregarListaCasais(elementId) {
        const select = document.getElementById(elementId);
        select.innerHTML = '<option value="">A carregar...</option>';

        const { data, error } = await _supabase.from('casal_config').select('nome, data_casamento').order('id', { ascending: false });

        if (error || !data || data.length === 0) {
            select.innerHTML = '<option value="">Nenhum casal encontrado</option>';
            return;
        }

        select.innerHTML = '<option value="">Selecione um casal...</option>';
        data.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.nome;
            opt.textContent = `${c.nome} (${c.data_casamento})`;
            select.appendChild(opt);
        });
    }

    async function salvarNovoCasal(e) {
        e.preventDefault();
        const nome = document.getElementById('nome-casal').value.trim();
        const data_casamento = document.getElementById('data-casal').value.trim();
        const horario = document.getElementById('horario-casal').value;

        if (!nome || !data_casamento || !horario) {
            alert("Preencha todos os campos.");
            return;
        }

        // Salva no Supabase
        const { error } = await _supabase.from('casal_config').insert([{ nome, data_casamento, horario }]);
        if (error) {
            alert("Erro ao criar casal.");
            return;
        }

        localStorage.setItem('casal_ativo', nome);
        window.location.href = "proxima_pagina.html";
    }

    function entrarCasalExistente() {
        const select = document.getElementById('select-casal');
        const nomeCasal = select.value;
        if (!nomeCasal) {
            alert("Por favor, selecione um casal.");
            return;
        }
        localStorage.setItem('casal_ativo', nomeCasal);
        window.location.href = "proxima_pagina.html";
    }

    function entrarAssistente() {
        const select = document.getElementById('select-casal-assistant');
        const nomeCasal = select.value;
        if (!nomeCasal) {
            alert("Por favor, selecione o casamento que vai acompanhar.");
            return;
        }
        localStorage.setItem('casal_ativo', nomeCasal);
        window.location.href = "proxima_pagina.html";
    }
</script>

</body>
</html>
