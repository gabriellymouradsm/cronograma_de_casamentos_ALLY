<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ally - Acesso e Configuração</title>

    <link rel="apple-touch-icon" sizes="180x180" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/Logotipo Monograma Elegante Preto.png">

    <!-- Biblioteca e Conexão do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-cream: #fbf8f3;
            --card-brown: #382a24;
            --input-bg: #f7f4ef;
        }

        body {
            background-color: var(--bg-cream);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2c221e;
        }

        .font-serif-title {
            font-family: 'Playfair Display', Georgia, serif;
        }

        .custom-input {
            background-color: var(--input-bg);
            color: #382a24;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
        }

        .custom-input:focus {
            outline: none;
            border-color: #8b6b55;
            box-shadow: 0 0 0 3px rgba(139, 107, 85, 0.25);
            background-color: #ffffff;
        }

        .card-container {
            background-color: var(--card-brown);
            box-shadow: 0 20px 40px rgba(56, 42, 36, 0.18);
            border-radius: 28px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .brand-logo-rings {
            width: 48px;
            height: 48px;
            margin: 0 auto 6px;
            display: block;
        }

        .brand-title {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #382a23;
            margin: 0;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 6px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 md:p-10">

    <header class="brand-header">
        <svg class="brand-logo-rings" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M35 50C46.0457 50 55 41.0457 55 30C55 18.9543 46.0457 10 35 10C23.9543 10 15 18.9543 15 30C15 41.0457 23.9543 50 35 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M65 50C76.0457 50 85 41.0457 85 30C85 18.9543 76.0457 10 65 10C53.9543 10 45 18.9543 45 30C45 41.0457 53.9543 50 65 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="3" fill="#c5a059"/>
        </svg>
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">PLANEJAMENTO DE CASAMENTO</p>
    </header>

    <main class="w-full max-w-md md:max-w-xl flex-1 flex flex-col justify-center">

        <!-- ================= TELA 1: LOGIN ================= -->
        <div id="tela-login" class="card-container text-white p-6 sm:p-8">
            <h2 class="text-2xl sm:text-3xl font-serif-title font-bold text-center mb-6 tracking-wide text-[#faf7f2]">
                Entrar no Sistema
            </h2>

            <form onsubmit="fazerLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Selecione o Casal</label>
                    <select id="loginCasalSelect" required class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium">
                        <option value="">A carregar casais...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Perfil de Acesso</label>
                    <select id="loginRole" onchange="mudarLabelLogin()" class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium">
                        <option value="admin">Administrador(a) do Casamento</option>
                        <option value="assistant">Assistente de Campo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title" id="loginLabelNome">Nome do Administrador</label>
                    <input type="text" id="loginNome" required placeholder="O seu nome" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium"/>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Senha de Acesso</label>
                    <div class="relative">
                        <input type="password" id="loginSenha" required placeholder="Digite a sua senha" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium pr-10"/>
                        <button type="button" onclick="togglePassword('loginSenha', 'eyeLogin')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#725a4d] hover:text-[#382a24]">
                            <i class="fa-solid fa-eye" id="eyeLogin"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#f7f4ef] hover:bg-white text-[#382a24] font-bold py-3.5 px-4 rounded-xl transition transform active:scale-95 shadow-md uppercase tracking-wider text-sm">
                        Entrar
                    </button>
                </div>

                <div class="flex flex-col items-center gap-2 mt-4 text-xs">
                    <button type="button" onclick="mudarTela('tela-cadastro')" class="text-[#d1c4bc] underline hover:text-white">
                        Primeiro acesso? Registar novo casal
                    </button>
                    <button type="button" onclick="mudarTela('tela-recuperar')" class="text-[#d1c4bc] underline hover:text-white">
                        Esqueceu-se da senha? Recuperar aqui
                    </button>
                </div>
            </form>
        </div>


        <!-- ================= TELA 2: PRIMEIRO ACESSO / CRIAR NOVO CASAL ================= -->
        <div id="tela-cadastro" class="card-container text-white p-6 sm:p-8 hidden">
            <h2 class="text-2xl sm:text-3xl font-serif-title font-bold text-center mb-6 tracking-wide text-[#faf7f2]">
                Registar Novo Casal
            </h2>

            <form onsubmit="registarCasal(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Nome do Casal</label>
                    <input type="text" id="cadCasalNome" required placeholder="Ex: Lucas & Mariana" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium"/>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-[#f0e8e0] mb-1">Data do Casamento</label>
                        <input type="text" id="cadData" required placeholder="DD/MM/AAAA" class="w-full custom-input px-3 py-2.5 rounded-xl text-center text-sm"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#f0e8e0] mb-1">Horário</label>
                        <input type="text" id="cadHorario" required placeholder="HH:MM" class="w-full custom-input px-3 py-2.5 rounded-xl text-center text-sm"/>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Perfil de Acesso</label>
                    <select id="cadRole" onchange="mudarLabelCadastro()" class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium">
                        <option value="admin">Administrador(a) do Casamento</option>
                        <option value="assistant">Assistente de Campo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title" id="cadLabelNome">Nome do Administrador</label>
                    <input type="text" id="cadNomeResponsavel" required placeholder="O seu nome" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium"/>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Definir Senha</label>
                    <div class="relative">
                        <input type="password" id="cadSenha" required placeholder="Mínimo de 6 caracteres" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium pr-10"/>
                        <button type="button" onclick="togglePassword('cadSenha', 'eyeCad')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#725a4d] hover:text-[#382a24]">
                            <i class="fa-solid fa-eye" id="eyeCad"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#f7f4ef] hover:bg-white text-[#382a24] font-bold py-3.5 px-4 rounded-xl transition transform active:scale-95 shadow-md uppercase tracking-wider text-sm">
                        Criar e Entrar
                    </button>
                </div>

                <div class="mt-4 text-center">
                    <button type="button" onclick="mudarTela('tela-login')" class="text-xs text-[#d1c4bc] underline hover:text-white">
                        ← Voltar para o Login
                    </button>
                </div>
            </form>
        </div>


        <!-- ================= TELA 3: RECUPERAR SENHA ================= -->
        <div id="tela-recuperar" class="card-container text-white p-6 sm:p-8 hidden">
            <h2 class="text-2xl sm:text-3xl font-serif-title font-bold text-center mb-6 tracking-wide text-[#faf7f2]">
                Recuperar Senha
            </h2>

            <form onsubmit="recuperarSenha(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Selecione o Casal</label>
                    <select id="recCasalSelect" required class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium">
                        <option value="">A carregar casais...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Perfil de Acesso</label>
                    <select id="recRole" class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium">
                        <option value="admin">Administrador(a) do Casamento</option>
                        <option value="assistant">Assistente de Campo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Nova Senha</label>
                    <div class="relative">
                        <input type="password" id="recNovaSenha" required placeholder="Digite a nova senha" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium pr-10"/>
                        <button type="button" onclick="togglePassword('recNovaSenha', 'eyeRec')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#725a4d] hover:text-[#382a24]">
                            <i class="fa-solid fa-eye" id="eyeRec"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#f7f4ef] hover:bg-white text-[#382a24] font-bold py-3.5 px-4 rounded-xl transition transform active:scale-95 shadow-md uppercase tracking-wider text-sm">
                        Atualizar Senha
                    </button>
                </div>

                <div class="mt-4 text-center">
                    <button type="button" onclick="mudarTela('tela-login')" class="text-xs text-[#d1c4bc] underline hover:text-white">
                        ← Voltar para o Login
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- TOAST DE ALERTA -->
    <div id="toast" class="fixed bottom-5 right-5 hidden z-50 bg-[#382a24] text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-[#6d5246] flex items-center gap-3">
        <i class="fa-solid fa-circle-exclamation text-amber-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Aviso</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarCasaisDropdown();
        });

        // Função para alternar entre as 3 telas sem sair da página
        function mudarTela(idTela) {
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('tela-cadastro').classList.add('hidden');
            document.getElementById('tela-recuperar').classList.add('hidden');
            
            document.getElementById(idTela).classList.remove('hidden');
            if (idTela === 'tela-login' || idTela === 'tela-recuperar') {
                carregarCasaisDropdown();
            }
        }

        // Criptografia SHA-256
        async function hashPassword(senha) {
            const encoder = new TextEncoder();
            const data = encoder.encode(senha);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function carregarCasaisDropdown() {
            const { data, error } = await _supabase.from('casal_config').select('nome');
            const selectLogin = document.getElementById('loginCasalSelect');
            const selectRec = document.getElementById('recCasalSelect');
            
            let opcoes = '<option value="">Selecione um casal...</option>';
            if (!error && data && data.length > 0) {
                data.forEach(c => {
                    opcoes += `<option value="${c.nome}">${c.nome}</option>`;
                });
            } else {
                opcoes = '<option value="">Nenhum casal registado</option>';
            }

            selectLogin.innerHTML = opcoes;
            selectRec.innerHTML = opcoes;
        }

        function mudarLabelLogin() {
            const role = document.getElementById('loginRole').value;
            document.getElementById('loginLabelNome').textContent = role === 'admin' ? "Nome do Administrador" : "Nome do Assistente";
        }

        function mudarLabelCadastro() {
            const role = document.getElementById('cadRole').value;
            document.getElementById('cadLabelNome').textContent = role === 'admin' ? "Nome do Administrador" : "Nome do Assistente";
        }

        function togglePassword(idInput, idIcon) {
            const input = document.getElementById(idInput);
            const icon = document.getElementById(idIcon);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = "fa-solid fa-eye-slash";
            } else {
                input.type = 'password';
                icon.className = "fa-solid fa-eye";
            }
        }

        // AÇÃO 1: FAZER LOGIN
        async function fazerLogin(e) {
            e.preventDefault();
            const casalNome = document.getElementById('loginCasalSelect').value;
            const role = document.getElementById('loginRole').value;
            const nomeResponsavel = document.getElementById('loginNome').value.trim();
            const senhaPura = document.getElementById('loginSenha').value;

            if (senhaPura.length < 6) {
                showToast("A senha precisa ter pelo menos 6 caracteres.");
                return;
            }

            const senhaHash = await hashPassword(senhaPura);

            const { data, error } = await _supabase
                .from('casal_config')
                .select('*')
                .eq('nome', casalNome)
                .maybeSingle();

            if (error || !data) {
                showToast("Casal não encontrado.");
                return;
            }

            const senhaArmazenada = role === 'admin' ? data.senha_admin : data.senha_assistente;

            if (!senhaArmazenada) {
                showToast("Nenhuma senha registada para este perfil. Utilize a opção de recuperar.");
                return;
            }

            if (senhaArmazenada !== senhaHash && senhaArmazenada !== senhaPura) {
                showToast("Senha incorreta. Tente novamente.");
                return;
            }

            // Sessão válida
            localStorage.setItem('user_role', role);
            localStorage.setItem('casal_ativo', casalNome);
            if (role === 'admin') {
                localStorage.setItem('admin_nome', nomeResponsavel);
            } else {
                localStorage.setItem('assistente_nome', nomeResponsavel);
            }

            window.location.href = "proxima_pagina.html";
        }

        // AÇÃO 2: REGISTAR NOVO CASAL
        async function registarCasal(e) {
            e.preventDefault();
            const casalNome = document.getElementById('cadCasalNome').value.trim();
            const dataCasamento = document.getElementById('cadData').value.trim();
            const horarioCasamento = document.getElementById('cadHorario').value.trim();
            const role = document.getElementById('cadRole').value;
            const nomeResponsavel = document.getElementById('cadNomeResponsavel').value.trim();
            const senhaPura = document.getElementById('cadSenha').value;

            if (senhaPura.length < 6) {
                showToast("A senha precisa ter pelo menos 6 caracteres.");
                return;
            }

            const senhaHash = await hashPassword(senhaPura);

            const { data: existente } = await _supabase.from('casal_config').select('id').eq('nome', casalNome).maybeSingle();
            if (existente) {
                showToast("Já existe um casal com este nome. Escolha outro.");
                return;
            }

            const novoRegistro = {
                nome: casalNome,
                data_casamento: dataCasamento,
                horario: horarioCasamento,
                [role === 'admin' ? 'senha_admin' : 'senha_assistente']: senhaHash
            };

            const { error: insertError } = await _supabase.from('casal_config').insert([novoRegistro]);

            if (insertError) {
                console.error(insertError);
                showToast("Erro ao criar o casal na base de dados.");
                return;
            }

            localStorage.setItem('user_role', role);
            localStorage.setItem('casal_ativo', casalNome);
            if (role === 'admin') {
                localStorage.setItem('admin_nome', nomeResponsavel);
            } else {
                localStorage.setItem('assistente_nome', nomeResponsavel);
            }

            window.location.href = "proxima_pagina.html";
        }

        // AÇÃO 3: RECUPERAR SENHA
        async function recuperarSenha(e) {
            e.preventDefault();
            const casalNome = document.getElementById('recCasalSelect').value;
            const role = document.getElementById('recRole').value;
            const senhaPura = document.getElementById('recNovaSenha').value;

            if (senhaPura.length < 6) {
                showToast("A nova senha precisa ter pelo menos 6 caracteres.");
                return;
            }

            const senhaHash = await hashPassword(senhaPura);
            const campoAtualizar = role === 'admin' ? 'senha_admin' : 'senha_assistente';

            const { error: updateError } = await _supabase
                .from('casal_config')
                .update({ [campoAtualizar]: senhaHash })
                .eq('nome', casalNome);

            if (updateError) {
                console.error(updateError);
                showToast("Erro ao atualizar a senha.");
                return;
            }

            showToast("Senha redefinida com sucesso!");
            mudarTela('tela-login');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }
    </script>
</body>
</html>
