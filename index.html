<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ally - Acesso e Configuração</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b2a22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ally">
    <link rel="apple-touch-icon" sizes="180x180" href="Logotipo Monograma Elegante Preto.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Logotipo Monograma Elegante Preto.png">

    <!-- Biblioteca e Conexão do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-cream: #fbf8f3;
            --card-brown: #382a24;
            --input-bg: #f7f4ef;
        }

        body {
            background-color: var(--bg-cream);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2c221e;
        }

        .font-serif-title {
            font-family: 'Playfair Display', Georgia, serif;
        }

        .custom-input {
            background-color: var(--input-bg);
            color: #382a24;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
        }

        .custom-input:focus {
            outline: none;
            border-color: #8b6b55;
            box-shadow: 0 0 0 3px rgba(139, 107, 85, 0.25);
            background-color: #ffffff;
        }

        .card-container {
            background-color: var(--card-brown);
            box-shadow: 0 20px 40px rgba(56, 42, 36, 0.18);
            border-radius: 28px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .brand-logo-rings {
            width: 48px;
            height: 48px;
            margin: 0 auto 6px;
            display: block;
        }

        .brand-title {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #382a23;
            margin: 0;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 6px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 md:p-10">

    <header class="brand-header">
        <svg class="brand-logo-rings" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M35 50C46.0457 50 55 41.0457 55 30C55 18.9543 46.0457 10 35 10C23.9543 10 15 18.9543 15 30C15 41.0457 23.9543 50 35 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M65 50C76.0457 50 85 41.0457 85 30C85 18.9543 76.0457 10 65 10C53.9543 10 45 18.9543 45 30C45 41.0457 53.9543 50 65 50Z" stroke="#382a23" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="3" fill="#c5a059"/>
        </svg>
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">PLANEJAMENTO DE CASAMENTO</p>
    </header>

    <main class="w-full max-w-md md:max-w-xl flex-1 flex flex-col justify-center">

        <!-- ================= TELA 1: LOGIN ================= -->
        <div id="tela-login" class="card-container text-white p-6 sm:p-8">
            <h2 class="text-2xl sm:text-3xl font-serif-title font-bold text-center mb-6 tracking-wide text-[#faf7f2]">
                Entrar no Sistema
            </h2>

            <form onsubmit="fazerLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Digite o Casal</label>
                    <input type="text" id="loginCasalInput" list="listaCasaisLogin" required placeholder="Digite o nome do casal..." class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium"/>
                    <datalist id="listaCasaisLogin"></datalist>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Perfil de Acesso</label>
                    <select id="loginRole" onchange="mudarLabelLogin()" class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium">
                        <option value="admin">Administrador(a) do Casamento</option>
                        <option value="assistant">Assistente de Campo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title" id="loginLabelNome">Nome do Administrador</label>
                    <input type="text" id="loginNome" required placeholder="O seu nome" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium"/>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Senha de Acesso</label>
                    <div class="relative">
                        <input type="password" id="loginSenha" required placeholder="Digite a sua senha" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium pr-10"/>
                        <button type="button" onclick="togglePassword('loginSenha', 'eyeLogin')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#725a4d] hover:text-[#382a24]">
                            <i class="fa-solid fa-eye" id="eyeLogin"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#f7f4ef] hover:bg-white text-[#382a24] font-bold py-3.5 px-4 rounded-xl transition transform active:scale-95 shadow-md uppercase tracking-wider text-sm">
                        Entrar
                    </button>
                </div>

                <div>
                    <button type="button" onclick="mudarTela('tela-novo-casal')" class="w-full bg-[#47362e] hover:bg-[#523d34] text-[#d1c4bc] hover:text-white font-bold py-3 px-4 rounded-xl transition border border-[#5d463b] uppercase tracking-wider text-xs shadow-md">
                        + Criar um Novo Casal
                    </button>
                </div>

                <div class="flex justify-between items-center mt-3 text-xs">
                    <button type="button" onclick="mudarTela('tela-cadastro-colaborador')" class="text-[#d1c4bc] underline hover:text-white">
                        Primeiro acesso? Registar colaborador
                    </button>
                    <button type="button" onclick="mudarTela('tela-recuperar')" class="text-[#d1c4bc] underline hover:text-white">
                        Esqueceu-se da senha?
                    </button>
                </div>
            </form>
        </div>


        <!-- ================= TELA 2: CRIAR NOVO CASAL ================= -->
        <div id="tela-novo-casal" class="card-container text-white p-6 sm:p-8 hidden">
            <h2 class="text-2xl sm:text-3xl font-serif-title font-bold text-center mb-6 tracking-wide text-[#faf7f2]">
                Criar Novo Casal
            </h2>

            <form onsubmit="criarNovoCasal(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Nome do Casal</label>
                    <input type="text" id="novoCasalNome" required placeholder="Ex: Lucas & Mariana" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium"/>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-[#f0e8e0] mb-1">Data do Casamento</label>
                        <input type="text" id="novoData" required placeholder="DD/MM/AAAA" class="w-full custom-input px-3 py-2.5 rounded-xl text-center text-sm"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#f0e8e0] mb-1">Horário</label>
                        <input type="text" id="novoHorario" required placeholder="HH:MM" class="w-full custom-input px-3 py-2.5 rounded-xl text-center text-sm"/>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#f7f4ef] hover:bg-white text-[#382a24] font-bold py-3.5 px-4 rounded-xl transition transform active:scale-95 shadow-md uppercase tracking-wider text-sm">
                        Criar Casal
                    </button>
                </div>

                <div class="mt-4 text-center">
                    <button type="button" onclick="mudarTela('tela-login')" class="text-xs text-[#d1c4bc] underline hover:text-white">
                        ← Voltar para o Login
                    </button>
                </div>
            </form>
        </div>


        <!-- ================= TELA 3: REGISTAR COLABORADOR ================= -->
        <div id="tela-cadastro-colaborador" class="card-container text-white p-6 sm:p-8 hidden">
            <h2 class="text-2xl sm:text-3xl font-serif-title font-bold text-center mb-6 tracking-wide text-[#faf7f2]">
                Registar Colaborador
            </h2>

            <form onsubmit="registarColaborador(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Perfil de Acesso</label>
                    <select id="cadColabRole" onchange="mudarLabelRegistarColab()" class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium">
                        <option value="admin">Administrador(a) do Casamento</option>
                        <option value="assistant">Assistente de Campo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title" id="cadColabLabelNome">Nome do Administrador</label>
                    <input type="text" id="cadColabNome" required placeholder="O seu nome" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium"/>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Senha</label>
                    <div class="relative">
                        <input type="password" id="cadColabSenha" required placeholder="Mínimo de 6 caracteres" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium pr-10"/>
                        <button type="button" onclick="togglePassword('cadColabSenha', 'eyeCad1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#725a4d] hover:text-[#382a24]">
                            <i class="fa-solid fa-eye" id="eyeCad1"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Confirmar Senha</label>
                    <div class="relative">
                        <input type="password" id="cadColabConfirmaSenha" required placeholder="Confirme a senha" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium pr-10"/>
                        <button type="button" onclick="togglePassword('cadColabConfirmaSenha', 'eyeCad2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#725a4d] hover:text-[#382a24]">
                            <i class="fa-solid fa-eye" id="eyeCad2"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#f7f4ef] hover:bg-white text-[#382a24] font-bold py-3.5 px-4 rounded-xl transition transform active:scale-95 shadow-md uppercase tracking-wider text-sm">
                        Criar
                    </button>
                </div>

                <div class="mt-4 text-center">
                    <button type="button" onclick="mudarTela('tela-login')" class="text-xs text-[#d1c4bc] underline hover:text-white">
                        ← Voltar para o Login
                    </button>
                </div>
            </form>
        </div>


        <!-- ================= TELA 4: RECUPERAR SENHA ================= -->
        <div id="tela-recuperar" class="card-container text-white p-6 sm:p-8 hidden">
            <h2 class="text-2xl sm:text-3xl font-serif-title font-bold text-center mb-6 tracking-wide text-[#faf7f2]">
                Atualizar Senha
            </h2>

            <form onsubmit="recuperarSenha(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Perfil de Acesso</label>
                    <select id="recRole" onchange="mudarLabelRecuperar()" class="w-full custom-input px-4 py-3 rounded-xl text-sm font-medium">
                        <option value="admin">Administrador(a) do Casamento</option>
                        <option value="assistant">Assistente de Campo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title" id="recLabelNome">Nome do Administrador</label>
                    <input type="text" id="recNome" required placeholder="O seu nome" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium"/>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Nova Senha</label>
                    <div class="relative">
                        <input type="password" id="recNovaSenha" required placeholder="Digite a nova senha" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium pr-10"/>
                        <button type="button" onclick="togglePassword('recNovaSenha', 'eyeRec1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#725a4d] hover:text-[#382a24]">
                            <i class="fa-solid fa-eye" id="eyeRec1"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#f0e8e0] mb-1.5 font-serif-title">Confirmar Nova Senha</label>
                    <div class="relative">
                        <input type="password" id="recConfirmaSenha" required placeholder="Confirme a nova senha" class="w-full custom-input px-4 py-3 rounded-xl text-center text-sm font-medium pr-10"/>
                        <button type="button" onclick="togglePassword('recConfirmaSenha', 'eyeRec2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#725a4d] hover:text-[#382a24]">
                            <i class="fa-solid fa-eye" id="eyeRec2"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#f7f4ef] hover:bg-white text-[#382a24] font-bold py-3.5 px-4 rounded-xl transition transform active:scale-95 shadow-md uppercase tracking-wider text-sm">
                        Atualizar Senha
                    </button>
                </div>

                <div class="mt-4 text-center">
                    <button type="button" onclick="mudarTela('tela-login')" class="text-xs text-[#d1c4bc] underline hover:text-white">
                        ← Voltar para o Login
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- TOAST DE ALERTA -->
    <div id="toast" class="fixed bottom-5 right-5 hidden z-50 bg-[#382a24] text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-[#6d5246] flex items-center gap-3">
        <i class="fa-solid fa-circle-exclamation text-amber-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Aviso</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarCasaisDropdown();
        });

        function mudarTela(idTela) {
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('tela-novo-casal').classList.add('hidden');
            document.getElementById('tela-cadastro-colaborador').classList.add('hidden');
            document.getElementById('tela-recuperar').classList.add('hidden');
            
            document.getElementById(idTela).classList.remove('hidden');
            if (idTela === 'tela-login') {
                carregarCasaisDropdown();
            }
        }

        async function hashPassword(senha) {
            const encoder = new TextEncoder();
            const data = encoder.encode(senha);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function carregarCasaisDropdown() {
            const { data, error } = await _supabase.from('casal_config').select('nome');
            const listaLogin = document.getElementById('listaCasaisLogin');
            
            let opcoes = '';
            if (!error && data && data.length > 0) {
                data.forEach(c => {
                    opcoes += `<option value="${c.nome}">`;
                });
            }

            listaLogin.innerHTML = opcoes;
        }

        function mudarLabelLogin() {
            const role = document.getElementById('loginRole').value;
            document.getElementById('loginLabelNome').textContent = role === 'admin' ? "Nome do Administrador" : "Nome do Assistente";
        }

        function mudarLabelRegistarColab() {
            const role = document.getElementById('cadColabRole').value;
            document.getElementById('cadColabLabelNome').textContent = role === 'admin' ? "Nome do Administrador" : "Nome do Assistente";
        }

        function mudarLabelRecuperar() {
            const role = document.getElementById('recRole').value;
            document.getElementById('recLabelNome').textContent = role === 'admin' ? "Nome do Administrador" : "Nome do Assistente";
        }

        function togglePassword(idInput, idIcon) {
            const input = document.getElementById(idInput);
            const icon = document.getElementById(idIcon);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = "fa-solid fa-eye-slash";
            } else {
                input.type = 'password';
                icon.className = "fa-solid fa-eye";
            }
        }

        // 1. FAZER LOGIN (Validando com SHA-256)
        async function fazerLogin(e) {
            e.preventDefault();
            const casalNome = document.getElementById('loginCasalInput').value.trim();
            const role = document.getElementById('loginRole').value;
            const nomeResponsavel = document.getElementById('loginNome').value.trim();
            const senhaDigitada = document.getElementById('loginSenha').value;

            if (!casalNome) {
                showToast("Por favor, selecione ou digite o nome do casal.");
                return;
            }

            const senhaHash = await hashPassword(senhaDigitada);

            const { data, error } = await _supabase
                .from('colaboradores')
                .select('*')
                .eq('role', role)
                .maybeSingle();

            if (error || !data) {
                showToast("Colaborador não encontrado na base de dados.");
                return;
            }

            if (data.senha_hash !== senhaHash && data.senha_hash !== senhaDigitada) {
                showToast("Senha incorreta. Tente novamente.");
                return;
            }

            localStorage.setItem('user_role', role);
            localStorage.setItem('casal_ativo', casalNome);
            if (role === 'admin') {
                localStorage.setItem('admin_nome', nomeResponsavel || data.nome);
            } else {
                localStorage.setItem('assistente_nome', nomeResponsavel || data.nome);
            }

            window.location.href = "proxima_pagina.html";
        }

        // 2. CRIAR NOVO CASAL
        async function criarNovoCasal(e) {
            e.preventDefault();
            const casalNome = document.getElementById('novoCasalNome').value.trim();
            const dataCasamento = document.getElementById('novoData').value.trim();
            const horarioCasamento = document.getElementById('novoHorario').value.trim();

            if (!casalNome || !dataCasamento || !horarioCasamento) {
                showToast("Preencha todos os campos.");
                return;
            }

            const { data: existente } = await _supabase.from('casal_config').select('id').eq('nome', casalNome).maybeSingle();
            if (existente) {
                showToast("Já existe um casal com este nome.");
                return;
            }

            const { error: insertError } = await _supabase.from('casal_config').insert([{
                nome: casalNome,
                data_casamento: dataCasamento,
                horario: horarioCasamento
            }]);

            if (insertError) {
                showToast("Erro ao criar o casal.");
                return;
            }

            showToast("Casal criado com sucesso!");
            mudarTela('tela-login');
        }

        // 3. REGISTAR COLABORADOR (Forçando o uso de hash SHA-256)
        async function registarColaborador(e) {
            e.preventDefault();
            const role = document.getElementById('cadColabRole').value;
            const nomeResponsavel = document.getElementById('cadColabNome').value.trim();
            const senhaPura = document.getElementById('cadColabSenha').value;
            const confirmaSenha = document.getElementById('cadColabConfirmaSenha').value;

            if (senhaPura.length < 6) {
                showToast("A senha precisa ter pelo menos 6 caracteres.");
                return;
            }

            if (senhaPura !== confirmaSenha) {
                showToast("As senhas não coincidem.");
                return;
            }

            const senhaHash = await hashPassword(senhaPura);

            const { error: insertError } = await _supabase.from('colaboradores').upsert([{
                role: role,
                nome: nomeResponsavel,
                senha_hash: senhaHash
            }], { onConflict: 'role' });

            if (insertError) {
                showToast("Erro ao guardar as credenciais.");
                return;
            }

            showToast("Colaborador registado com sucesso!");
            mudarTela('tela-login');
        }

        // 4. ATUALIZAR SENHA (Com nome, validação e hash SHA-256)
        async function recuperarSenha(e) {
            e.preventDefault();
            const role = document.getElementById('recRole').value;
            const nomeResponsavel = document.getElementById('recNome').value.trim();
            const novaSenha = document.getElementById('recNovaSenha').value;
            const confirmaSenha = document.getElementById('recConfirmaSenha').value;

            if (novaSenha.length < 6) {
                showToast("A nova senha precisa ter pelo menos 6 caracteres.");
                return;
            }

            if (novaSenha !== confirmaSenha) {
                showToast("As novas senhas não coincidem.");
                return;
            }

            const senhaHash = await hashPassword(novaSenha);

            const { error: updateError } = await _supabase
                .from('colaboradores')
                .update({ 
                    nome: nomeResponsavel,
                    senha_hash: senhaHash 
                })
                .eq('role', role);

            if (updateError) {
                showToast("Erro ao atualizar a senha.");
                return;
            }

            showToast("Senha redefinida com sucesso!");
            mudarTela('tela-login');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }
    </script>
</body>
</html>
