<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ally - Login e Acesso</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yatnbvnnyxivquovpepe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j8G631CbvAGHN9yGsW6SSA_2x1inYVQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #f7f5f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #382a23;
        }

        .brand-tagline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #725a4d;
            margin-top: 5px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background-color: #3b2a24;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            color: #ffffff;
            text-align: center;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #faf7f2;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-primary {
            background-color: #fcfaf7;
            color: #3b2a24;
        }

        .btn-primary:hover {
            background-color: #f2eee9;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            background-color: #fcfaf7;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            color: #3b2a24;
            outline: none;
            margin-bottom: 12px;
        }

        .input-field::placeholder {
            color: #b5ada5;
            font-style: italic;
        }

        select.input-field {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .back-link {
            color: #eadecc;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
        }

        .label-text {
            display: block;
            text-align: left;
            font-size: 12px;
            color: #d1c4bc;
            margin-bottom: 4px;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <header class="brand-header">
        <h1 class="brand-title">Ally</h1>
        <p class="brand-tagline">PLANEJAMENTO DE CASAMENTO</p>
    </header>

    <!-- TELA INICIAL: SELECIONAR PERFIL -->
    <div class="card" id="view-role">
        <h2>Selecione o seu perfil</h2>
        <div class="btn-group">
            <button class="action-btn btn-primary" onclick="escolherPerfil('admin')">👑 Administrador (Casal)</button>
            <button class="action-btn btn-secondary" onclick="escolherPerfil('assistant')">📋 Assistente de Campo</button>
        </div>
    </div>

    <!-- TELA DO ADMINISTRADOR (TELA ÚNICA) -->
    <div class="card hidden" id="view-admin">
        <h2>Área do Administrador</h2>
        
        <div style="text-align: left; margin-bottom: 15px;">
            <label class="label-text">Selecione um casal existente (opcional para Acesso):</label>
            <select id="select-casal-admin" class="input-field" onchange="preencherDadosCasal(this)">
                <option value="">A carregar casais...</option>
            </select>
        </div>

        <form id="form-admin" onsubmit="salvarOuAcessarAdmin(event)">
            <label class="label-text">Nome do Casal</label>
            <input type="text" id="admin-nome-casal" class="input-field" placeholder="Ex: Ana & João" required>

            <label class="label-text">Data do Casamento</label>
            <input type="text" id="admin-data-casal" class="input-field" placeholder="Ex: 20/10/2026" required>

            <label class="label-text">Horário do Casamento</label>
            <input type="time" id="admin-horario-casal" class="input-field" required>

            <label class="label-text">Nome do Administrador</label>
            <input type="text" id="admin-nome-adm" class="input-field" placeholder="Nome do Responsável" required>

            <label class="label-text">Senha do Administrador</label>
            <input type="password" id="admin-senha" class="input-field" placeholder="Senha de Acesso" required>

            <div class="btn-row">
                <button type="submit" name="acao" value="criar" class="action-btn btn-primary">✨ Criar Novo Casal</button>
                <button type="button" onclick="entrarCasalExistenteAdmin()" class="action-btn btn-secondary">📂 Acessar Existente</button>
            </div>
        </form>
        <span class="back-link" onclick="voltarParaPerfil()">← Voltar</span>
    </div>

    <!-- TELA DO ASSISTENTE (TELA ÚNICA) -->
    <div class="card hidden" id="view-assistente">
        <h2>Acesso Assistente</h2>
        <p style="font-size: 13px; color: #d1c4bc; margin-bottom: 15px;">Selecione o casamento que vai acompanhar:</p>
        
        <div style="text-align: left; margin-bottom: 15px;">
            <select id="select-casal-assistant" class="input-field" onchange="preencherDadosAssistente(this)">
                <option value="">A carregar casais...</option>
            </select>
        </div>

        <form onsubmit="entrarAssistente(event)">
            <label class="label-text">Nome do Casal Selecionado</label>
            <input type="text" id="assistant-nome-casal" class="input-field" placeholder="Selecione acima" readonly style="background-color: #eae5de; cursor: not-allowed;">

            <label class="label-text">Data do Casamento</label>
            <input type="text" id="assistant-data-casal" class="input-field" placeholder="--" readonly style="background-color: #eae5de; cursor: not-allowed;">

            <label class="label-text">Horário do Casamento</label>
            <input type="text" id="assistant-horario-casal" class="input-field" placeholder="--" readonly style="background-color: #eae5de; cursor: not-allowed;">

            <label class="label-text">Nome do Assistente</label>
            <input type="text" id="assistant-nome" class="input-field" placeholder="O seu nome" required>

            <label class="label-text">Senha do Assistente</label>
            <input type="password" id="assistant-senha" class="input-field" placeholder="Senha de Acesso" required>

            <button type="submit" class="action-btn btn-primary" style="margin-top: 10px;">Entrar como Assistente</button>
        </form>
        <span class="back-link" onclick="voltarParaPerfil()">← Voltar</span>
    </div>

<script>
    let listaCasaisGlobal = [];

    async function escolherPerfil(role) {
        localStorage.setItem('user_role', role);
        document.getElementById('view-role').classList.add('hidden');

        if (role === 'admin') {
            document.getElementById('view-admin').classList.remove('hidden');
            await carregarListaCasais('select-casal-admin');
        } else {
            document.getElementById('view-assistente').classList.remove('hidden');
            await carregarListaCasais('select-casal-assistant');
        }
    }

    function voltarParaPerfil() {
        localStorage.clear();
        document.getElementById('view-admin').classList.add('hidden');
        document.getElementById('view-assistente').classList.add('hidden');
        document.getElementById('view-role').classList.remove('hidden');
    }

    async function carregarListaCasais(elementId) {
        const select = document.getElementById(elementId);
        select.innerHTML = '<option value="">A carregar...</option>';

        const { data, error } = await _supabase.from('casal_config').select('*').order('id', { ascending: false });

        if (error || !data || data.length === 0) {
            select.innerHTML = '<option value="">Nenhum casal encontrado</option>';
            listaCasaisGlobal = [];
            return;
        }

        listaCasaisGlobal = data;
        select.innerHTML = '<option value="">-- Selecione um casal já criado --</option>';
        data.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.nome;
            opt.textContent = `${c.nome} (${c.data_casamento})`;
            select.appendChild(opt);
        });
    }

    function preencherDadosCasal(selectElem) {
        const nomeSelecionado = selectElem.value;
        const casal = listaCasaisGlobal.find(c => c.nome === nomeSelecionado);
        if (casal) {
            document.getElementById('admin-nome-casal').value = casal.nome;
            document.getElementById('admin-data-casal').value = casal.data_casamento;
            document.getElementById('admin-horario-casal').value = casal.horario;
        }
    }

    function preencherDadosAssistente(selectElem) {
        const nomeSelecionado = selectElem.value;
        const casal = listaCasaisGlobal.find(c => c.nome === nomeSelecionado);
        if (casal) {
            document.getElementById('assistant-nome-casal').value = casal.nome;
            document.getElementById('assistant-data-casal').value = casal.data_casamento;
            document.getElementById('assistant-horario-casal').value = casal.horario;
        }
    }

    async function salvarOuAcessarAdmin(e) {
        e.preventDefault();
        const nome = document.getElementById('admin-nome-casal').value.trim();
        const data_casamento = document.getElementById('admin-data-casal').value.trim();
        const horario = document.getElementById('admin-horario-casal').value;
        const adminNome = document.getElementById('admin-nome-adm').value.trim();
        const adminSenha = document.getElementById('admin-senha').value.trim();

        if (!nome || !data_casamento || !horario || !adminNome || !adminSenha) {
            alert("Preencha todos os campos do Administrador.");
            return;
        }

        // Verifica se o casal já existe na base de dados
        const { data: existente } = await _supabase.from('casal_config').select('*').eq('nome', nome).maybeSingle();

        if (!existente) {
            // Se não existe, cria um novo registo
            const { error } = await _supabase.from('casal_config').insert([{ nome, data_casamento, horario }]);
            if (error) {
                alert("Erro ao criar o novo casal.");
                return;
            }
        }

        localStorage.setItem('casal_ativo', nome);
        localStorage.setItem('admin_nome', adminNome);
        window.location.href = "proxima_pagina.html";
    }

    async function entrarCasalExistenteAdmin() {
        const select = document.getElementById('select-casal-admin');
        const nomeCasal = select.value;
        const adminNome = document.getElementById('admin-nome-adm').value.trim();
        const adminSenha = document.getElementById('admin-senha').value.trim();

        if (!nomeCasal) {
            alert("Por favor, selecione um casal na lista acima.");
            return;
        }
        if (!adminNome || !adminSenha) {
            alert("Preencha o nome e a senha do Administrador para entrar.");
            return;
        }

        localStorage.setItem('casal_ativo', nomeCasal);
        localStorage.setItem('admin_nome', adminNome);
        window.location.href = "proxima_pagina.html";
    }

    function entrarAssistente(e) {
        e.preventDefault();
        const nomeCasal = document.getElementById('assistant-nome-casal').value.trim();
        const assistenteNome = document.getElementById('assistant-nome').value.trim();
        const assistenteSenha = document.getElementById('assistant-senha').value.trim();

        if (!nomeCasal) {
            alert("Por favor, selecione um casamento na lista.");
            return;
        }
        if (!assistenteNome || !assistenteSenha) {
            alert("Preencha o nome e a senha do Assistente.");
            return;
        }

        localStorage.setItem('user_role', 'assistant');
        localStorage.setItem('casal_ativo', nomeCasal);
        localStorage.setItem('assistente_nome', assistenteNome);
        window.location.href = "proxima_pagina.html";
    }
</script>

</body>
</html>
