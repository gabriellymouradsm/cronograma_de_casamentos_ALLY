    <script>
        let nomeSalvo = "";
        let dataSalva = "";
        let horarioSalvo = "";
        let diasFaltandoGlobal = 0;

        window.addEventListener("DOMContentLoaded", async function () {
            const userRole = localStorage.getItem('user_role');
            const adminNome = localStorage.getItem('admin_nome');
            const assistenteNome = localStorage.getItem('assistente_nome');
            const casalAtivo = localStorage.getItem('casal_ativo');

            if (userRole === 'admin' && adminNome) {
                document.getElementById("tituloNomeUsuario").textContent = adminNome;
                document.getElementById("subtituloPerfil").textContent = "Administrador(a)";
            } else if (userRole === 'assistant' && assistenteNome) {
                document.getElementById("tituloNomeUsuario").textContent = assistenteNome;
                document.getElementById("subtituloPerfil").textContent = "Assistente de Campo";
            }

            const { data, error } = await _supabase
                .from('casal_config')
                .select('*')
                .eq('nome', casalAtivo)
                .maybeSingle();

            if (!error && data) {
                nomeSalvo = data.nome;
                dataSalva = data.data_casamento;
                horarioSalvo = data.horario;

                document.getElementById("exibirNome").textContent = nomeSalvo;
                document.getElementById("exibirData").textContent = dataSalva;
                document.getElementById("exibirHorario").textContent = horarioSalvo;

                atualizarCronometro();
                setInterval(atualizarCronometro, 60000);
            } else {
                alert("Nenhum dado encontrado para este casal. Voltando ao início.");
                window.location.href = "index.html";
            }
        });

        function atualizarCronometro() {
            if (!dataSalva || !horarioSalvo) return;

            const partesData = dataSalva.split("/");
            const partesHorario = horarioSalvo.split(":");

            if (partesData.length !== 3 || partesHorario.length !== 2) return;

            const dia = parseInt(partesData[0], 10);
            const mes = parseInt(partesData[1], 10) - 1;
            const ano = parseInt(partesData[2], 10);
            const hora = parseInt(partesHorario[0], 10);
            const minuto = parseInt(partesHorario[1], 10);

            const dataEvento = new Date(ano, mes, dia, hora, minuto, 0);
            const agora = new Date();
            const diferencaTempo = dataEvento - agora;

            if (diferencaTempo <= 0) {
                document.getElementById("cronometroLayout").innerHTML =
                    `<div style="width:100%;text-align:center;font-size:18px;">O grande dia chegou! 🎉</div>`;
                diasFaltandoGlobal = 0;
                return;
            }

            const dias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencaTempo % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencaTempo % (1000 * 60 * 60)) / (1000 * 60));

            diasFaltandoGlobal = dias;

            document.getElementById("contadorDias").textContent = String(dias).padStart(2, "0");
            document.getElementById("contadorHoras").textContent = String(horas).padStart(2, "0");
            document.getElementById("contadorMinutos").textContent = String(minutos).padStart(2, "0");
        }

        function compartilharWhatsApp() {
            let mensagem = "*Grande Notícia!* 🔔\n\n";
            mensagem += "Planejamento do casamento de *" + nomeSalvo + "*\n";
            mensagem += "🗓️ *Data:* " + dataSalva + "\n";
            mensagem += "⏰ *Horário:* " + horarioSalvo + "\n\n";

            if (diasFaltandoGlobal > 0) {
                mensagem += "Faltam apenas *" + diasFaltandoGlobal + " dias* para essa celebração especial! ✨";
            } else {
                mensagem += "Chegou o momento de comemorar! 🎉";
            }

            const urlWhatsApp = "https://wa.me/?text=" + encodeURIComponent(mensagem);
            window.open(urlWhatsApp, "_blank");
        }

        function editarInformacoes() {
            window.location.href = "index.html";
        }

        function abrirModalPDF() {
            document.getElementById('modalPDF').style.display = 'flex';
        }

        function fecharModalPDF() {
            document.getElementById('modalPDF').style.display = 'none';
        }

        async function gerarPDFPersonalizado() {
            fecharModalPDF();

            const incluirCronograma = document.getElementById('chk-cronograma').checked;
            const incluirChecklist = document.getElementById('chk-checklist').checked;
            const incluirConvidados = document.getElementById('chk-convidados').checked;
            const incluirFornecedores = document.getElementById('chk-fornecedores').checked;
            const incluirNotas = document.getElementById('chk-notas').checked;

            let cronograma = [], convidados = [], fornecedores = [], checklist = [], notas = [];

            if (incluirCronograma) {
                const { data } = await _supabase.from('cronograma_dia').select('*').eq('casal_nome', nomeSalvo);
                cronograma = data || [];
            }
            if (incluirChecklist) {
                const { data } = await _supabase.from('checklist').select('*').eq('casal_nome', nomeSalvo);
                checklist = data || [];
            }
            if (incluirConvidados) {
                const { data } = await _supabase.from('convidados').select('*').eq('casal_nome', nomeSalvo);
                convidados = data || [];
            }
            if (incluirFornecedores) {
                const { data } = await _supabase.from('fornecedores').select('*').eq('casal_nome', nomeSalvo);
                fornecedores = data || [];
            }
            if (incluirNotas) {
                const { data } = await _supabase.from('notas_notebook').select('*').eq('casal_nome', nomeSalvo);
                notas = data || [];
            }

            let contentArray = [
                { text: 'ALLY', style: 'brandTitle' },
                { text: 'PLANEJAMENTO & CRONOGRAMA DE CASAMENTO', style: 'brandSubtitle' },
                { canvas: [{ type: 'line', x1: 0, y1: 10, x2: 515, y2: 10, lineWidth: 1.5, lineColor: '#3b2a22' }] },
                { text: '', margin: [0, 5] },

                {
                    table: {
                        widths: ['*', '*'],
                        body: [
                            [
                                { text: 'Casal: ' + (nomeSalvo || '-'), style: 'infoBoxText' },
                                { text: 'Data: ' + (dataSalva || '-'), style: 'infoBoxText' }
                            ],
                            [
                                { text: 'Horário: ' + (horarioSalvo || '-'), style: 'infoBoxText' },
                                { text: 'Dias Restantes: ' + diasFaltandoGlobal, style: 'infoBoxText' }
                            ]
                        ]
                    },
                    layout: {
                        fillColor: function () { return '#fcfaf7'; },
                        hLineWidth: function () { return 0.5; },
                        vLineWidth: function () { return 0.5; },
                        hLineColor: function () { return '#eadecc'; },
                        vLineColor: function () { return '#eadecc'; },
                        paddingTop: function () { return 8; },
                        paddingBottom: function () { return 8; },
                        paddingLeft: function () { return 10; },
                        paddingRight: function () { return 10; }
                    },
                    margin: [0, 5, 0, 15]
                }
            ];

            let secaoIndex = 1;

            if (incluirCronograma) {
                contentArray.push({ text: `${secaoIndex++}. Cronograma do Dia`, style: 'sectionTitle' });
                contentArray.push(criarTabelaPDF(cronograma, ['Horário', 'Atividade / Evento'], item => [
                    { text: item.time || '-', style: 'cellBold' }, 
                    { text: item.note ? `${item.text} (Obs: ${item.note})` : item.text || '-', style: 'cellNormal' }
                ], [80, 435]));
            }

            if (incluirChecklist) {
                contentArray.push({ text: `${secaoIndex++}. Check List`, style: 'sectionTitle' });
                contentArray.push(criarTabelaPDF(checklist, ['Tarefa', 'Status'], item => [
                    { text: item.text || '-', style: 'cellNormal' }, 
                    { text: item.checked ? 'Concluído' : 'Pendente', style: item.checked ? 'cellSuccess' : 'cellPending' }
                ], [400, 115]));
            }

            if (incluirConvidados) {
                contentArray.push({ text: `${secaoIndex++}. Lista de Convidados`, style: 'sectionTitle' });
                contentArray.push(criarTabelaPDF(convidados, ['Nome do Convidado', 'Categoria', 'Confirmado'], item => [
                    { text: `${item.first_name} ${item.last_name || ''}`.trim(), style: 'cellBold' },
                    { text: `${item.connection} (Mesa ${item.table_number})`, style: 'cellNormal' },
                    { text: item.present ? 'Sim' : 'Não', style: item.present ? 'cellSuccess' : 'cellPending' }
                ], [170, 245, 100]));
            }

            if (incluirFornecedores) {
                contentArray.push({ text: `${secaoIndex++}. Fornecedores`, style: 'sectionTitle' });
                contentArray.push(criarTabelaPDF(fornecedores, ['Serviço / Categoria', 'Nome do Fornecedor', 'Contato'], item => [
                    { text: item.category || '-', style: 'cellBold' },
                    { text: item.name || '-', style: 'cellNormal' },
                    { text: `${item.phone ? item.phone : ''}${item.status ? ' (Status: ' + item.status + ')' : ''}${item.notes ? ' | Obs: ' + item.notes : ''}`.trim(), style: 'cellNormal' }
                ], [130, 170, 215]));
            }

            if (incluirNotas) {
                contentArray.push({ text: `${secaoIndex++}. Notebook (Anotações)`, style: 'sectionTitle' });
                contentArray.push(criarTabelaPDF(notas, ['Título', 'Conteúdo / Detalhes'], item => [
                    { text: item.titulo || 'Sem título', style: 'cellBold' },
                    { text: item.conteudo || '(Anexo de mídia)', style: 'cellNormal' }
                ], [130, 385]));
            }

            const docDefinition = {
                pageSize: 'A4',
                pageMargins: [36, 40, 36, 40],
                content: contentArray,
                styles: {
                    brandTitle: { fontStyle: 'serif', fontSize: 24, bold: true, alignment: 'center', color: '#3b2a22' },
                    brandSubtitle: { fontSize: 8, bold: true, alignment: 'center', color: '#725a4d', margin: [0, 2, 0, 0] },
                    sectionTitle: { fontSize: 12, bold: true, color: '#3b2a22', margin: [0, 12, 0, 6] },
                    tableHeader: { bold: true, fontSize: 9, color: '#ffffff', fillColor: '#3b2a22' },
                    infoBoxText: { fontSize: 10, color: '#3b2a22', bold: false },
                    cellBold: { fontSize: 9, bold: true, color: '#2c221e' },
                    cellNormal: { fontSize: 9, color: '#333333' },
                    cellSuccess: { fontSize: 9, bold: true, color: '#128c7e' },
                    cellPending: { fontSize: 9, bold: true, color: '#a83232' },
                    noData: { italic: true, color: '#888888', margin: [0, 0, 0, 10], fontSize: 9 }
                },
                defaultStyle: { fontSize: 9, color: '#333333' }
            };

            pdfMake.createPdf(docDefinition).download('Relatorio_Casamento_' + (nomeSalvo || 'Ally') + '.pdf');
        }

        function criarTabelaPDF(dados, cabecalhos, mapearLinha, colWidthsArray) {
            if (!dados || dados.length === 0) {
                return { text: 'Nenhuma informação registrada nesta seção.', style: 'noData' };
            }

            const bodyTable = [cabecalhos.map(h => ({ text: h, style: 'tableHeader' }))];

            dados.forEach(item => {
                bodyTable.push(mapearLinha(item));
            });

            return {
                table: {
                    headerRows: 1,
                    widths: colWidthsArray || cabecalhos.map(() => '*'),
                    body: bodyTable
                },
                layout: {
                    fillColor: function (rowIndex) {
                        if (rowIndex === 0) return '#3b2a22';
                        return (rowIndex % 2 === 0) ? '#f2eee9' : '#ffffff';
                    },
                    hLineWidth: function () { return 0.5; },
                    vLineWidth: function () { return 0.5; },
                    hLineColor: function () { return '#eadecc'; },
                    vLineColor: function () { return '#eadecc'; },
                    paddingTop: function () { return 6; },
                    paddingBottom: function () { return 6; },
                    paddingLeft: function () { return 8; },
                    paddingRight: function () { return 8; }
                },
                margin: [0, 0, 0, 12]
            };
        }
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registado com sucesso:', reg.scope))
                .catch(err => console.log('Falha ao registar o Service Worker:', err));
        });
    }
</script>
